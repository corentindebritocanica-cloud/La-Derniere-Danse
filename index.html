<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Cabaret des Étoiles — Galerie, 1925</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,400&family=La+Belle+Aurore&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#f1e7d3; --encre:#1a1512; --rouge:#a8201a; --bleu:#1f3a5f; --brun:#5a3e1b;
  --papier:#e9dcc0; --ombre:rgba(26,21,18,.35);
  --f-title:'Limelight',serif; --f-body:'Bodoni Moda',Didot,serif; --f-hand:'La Belle Aurore',cursive; --f-type:'Special Elite',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.05;
  background-image:radial-gradient(circle at 20% 30%, #000 0, transparent 1px), radial-gradient(circle at 70% 60%, #000 0, transparent 1px), radial-gradient(circle at 40% 80%, #000 0, transparent 1px);
  background-size:60px 60px, 90px 90px, 75px 75px;}

/* ---------- HERO ---------- */
.hero{padding:36px 20px 26px;text-align:center;position:relative;border-bottom:1px solid var(--brun)}
.hero .lieu{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--brun);margin-bottom:10px}
.hero svg.rays{display:block;margin:0 auto}
.hero h1{font-family:var(--f-title);margin:10px 0 2px;font-size:15px;letter-spacing:6px;text-transform:uppercase;color:var(--encre)}
.hero h2{font-family:var(--f-title);margin:0;font-size:44px;letter-spacing:2px;color:var(--rouge);line-height:1.05}
.hero .souslegende{font-family:var(--f-hand);font-size:20px;color:var(--bleu);margin-top:8px;transform:rotate(-1deg)}
.btn-code{margin-top:18px;padding:9px 24px;font-family:var(--f-title);font-size:12px;letter-spacing:2px;text-transform:uppercase;background:transparent;border:1.5px solid var(--rouge);color:var(--rouge);border-radius:2px;cursor:pointer}
.btn-code:active{background:var(--rouge);color:var(--papier)}
.btn-code{position:relative;animation:codePulse 2.6s ease-in-out infinite}
.btn-code::before,.btn-code::after{content:'✦';position:absolute;top:50%;font-size:11px;color:var(--rouge);transform:translateY(-50%);animation:codeEtoile 2.6s ease-in-out infinite}
.btn-code::before{left:-18px}.btn-code::after{right:-18px}
@keyframes codePulse{0%,100%{box-shadow:0 0 0 0 rgba(168,32,26,.35)}50%{box-shadow:0 0 0 7px rgba(168,32,26,0)}}
@keyframes codeEtoile{0%,100%{opacity:.35}50%{opacity:1}}
.medaillon.ouvre{animation:ouvreAnim .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes ouvreAnim{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.voile.show .feuille > *{animation:ficheIn .5s ease both}
.voile.show .feuille > *:nth-child(2){animation-delay:.05s}
.voile.show .feuille > *:nth-child(3){animation-delay:.12s}
.voile.show .feuille > *:nth-child(4){animation-delay:.18s}
.voile.show .feuille > *:nth-child(5){animation-delay:.24s}
.voile.show .feuille > *:nth-child(n+6){animation-delay:.3s}
@keyframes ficheIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.voile.show .feuille .foto-fiche{animation:photoIn .7s ease both}
@keyframes photoIn{from{opacity:0;filter:sepia(1) blur(3px)}to{opacity:1;filter:sepia(.15) blur(0)}}
.carte-bonus .nom{color:var(--rouge)}
.medaillon.secoue{animation:shk .4s}

/* ---------- GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px;padding:28px 18px 10px;max-width:640px;margin:0 auto}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);max-width:900px}}

.card{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:inherit;color:inherit}
.medaillon{position:relative;width:100%;aspect-ratio:1;max-width:132px}
.medaillon svg.frame{position:absolute;inset:0;width:100%;height:100%}
.medaillon .foto{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;object-fit:cover;object-position:50% 18%;border:3px solid var(--brun);box-shadow:0 2px 6px var(--ombre);background:#d8c9a3}
.medaillon .silhouette{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.medaillon .silhouette svg{width:70%;height:70%;overflow:visible}
.medaillon .badge{position:absolute;right:-2%;bottom:-2%;width:40%;height:40%;border-radius:50%;background:var(--papier);border:2px solid var(--rouge);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px var(--ombre)}
.medaillon .badge svg{width:62%;height:62%;overflow:visible}
.medaillon .icone{position:absolute;inset:22%;width:56%;height:56%;display:flex;align-items:center;justify-content:center}
.medaillon .icone svg{width:100%;height:100%;overflow:visible}
.card .nom{font-family:var(--f-title);font-size:12.5px;letter-spacing:1px;text-align:center;line-height:1.25;min-height:2.4em}
.card .role{font-size:10px;font-style:italic;color:var(--brun);text-align:center;letter-spacing:.3px}

.card.locked .medaillon{opacity:.55}
.card.nouveau .medaillon::after{content:'✦';position:absolute;top:-4px;left:-4px;width:24px;height:24px;border-radius:50%;background:var(--rouge);color:var(--papier);font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px var(--ombre);animation:pulseBadge 1.6s ease-in-out infinite;z-index:3}
@keyframes pulseBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.medaillon.eclat{animation:eclatAnim 1.2s ease}
@keyframes eclatAnim{
  0%{box-shadow:0 0 0 0 rgba(168,32,26,.55);transform:scale(1)}
  35%{box-shadow:0 0 0 12px rgba(168,32,26,.25);transform:scale(1.09)}
  100%{box-shadow:0 0 0 26px rgba(168,32,26,0);transform:scale(1)}
}.card.locked .nom{font-family:var(--f-body);font-style:italic;color:var(--brun);font-size:11px}
.card.locked .role{visibility:hidden}
.card:active .medaillon{transform:scale(.96)}

/* ---------- ANIMATIONS (jouées au tap) ---------- */
.icone svg{transform-origin:50% 50%}
.play .p-brush{animation:brush .6s ease}
.play .p-owleye{animation:owl .6s ease}
.play .p-star-rays{animation:starspin .8s ease}
.play .p-flash{animation:flash .5s ease}
.play .p-croissant{animation:bob .6s ease}
.play .p-pennib{animation:scribble .6s ease}
.play .p-fan{animation:fan .6s ease}
.play .p-mustache{animation:wiggle .5s ease}
.play .p-trumpet{animation:raise .6s ease}
.play .p-page{animation:flip .6s ease}
.play .p-tail{animation:wag .7s ease}
.play .p-broom{animation:sweep .6s ease}
.play .p-glint{animation:glint .6s ease}
.play .p-wheel{animation:spin .6s linear}
.play .p-blossom{animation:sway .8s ease}
.play .p-book{animation:pageturn .6s ease}
.play .p-baton{animation:tap .5s ease}

@keyframes brush{0%,100%{transform:rotate(0)}30%{transform:rotate(-22deg)}60%{transform:rotate(14deg)}}
@keyframes owl{0%,100%{transform:scaleY(1)}45%,55%{transform:scaleY(.15)}}
@keyframes starspin{from{transform:rotate(0)}to{transform:rotate(150deg)}}
@keyframes flash{0%,100%{opacity:0}20%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scribble{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
@keyframes fan{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-18deg) scale(1.05)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes raise{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-6deg)}}
@keyframes flip{0%,100%{transform:rotateY(0)}50%{transform:rotateY(60deg)}}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}75%{transform:rotate(-14deg)}}
@keyframes sweep{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes glint{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@keyframes pageturn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.1)}}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}

/* ---------- MODALES ---------- */
.voile{position:fixed;inset:0;background:rgba(26,21,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
.voile.show{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s,visibility 0s}
@media(min-width:600px){.voile{align-items:center}}

.feuille{background:var(--papier);width:100%;max-width:420px;border-radius:14px 14px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(30px);transition:transform .3s;max-height:80vh;overflow-y:auto;border-top:3px solid var(--rouge);box-shadow:0 -4px 24px var(--ombre)}
@media(min-width:600px){.feuille{border-radius:6px;border:1px solid var(--brun);border-top:3px solid var(--rouge)}}
.voile.show .feuille{transform:translateY(0)}
.feuille .ferm{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--papier);border:2px solid var(--rouge);font-family:var(--f-body);font-size:19px;color:var(--rouge);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px var(--ombre);z-index:2}
.feuille{position:relative}
.feuille .foto-fiche{width:100%;max-height:260px;object-fit:cover;object-position:50% 18%;border:1px solid var(--brun);margin-bottom:14px;filter:sepia(.15)}
.feuille h3{font-family:var(--f-title);color:var(--rouge);font-size:24px;margin:0 0 2px;letter-spacing:.5px}
.feuille .sousrole{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--brun);margin-bottom:14px}
.feuille p{line-height:1.55;font-size:15px;margin:0 0 12px}
.feuille .citation{font-family:var(--f-hand);font-size:21px;color:var(--bleu);margin:16px 0 4px;transform:rotate(-.6deg)}
.feuille .ajout{border-top:1px dashed var(--brun);margin-top:14px;padding-top:12px}

.pass-feuille{max-width:340px;text-align:center;padding-top:58px !important}
.pass-feuille h3{font-size:22px;line-height:1.2;padding:0 6px}
.bonus-contenu{padding-top:40px !important}
.pass-feuille p{font-size:14px;color:var(--brun);font-style:italic}
.pass-feuille input{font-family:var(--f-type);font-size:18px;letter-spacing:3px;text-align:center;text-transform:uppercase;
  width:100%;padding:12px;border:1px solid var(--brun);background:#fffdf6;color:var(--encre);border-radius:2px;margin:10px 0}
.pass-feuille input:focus{outline:2px solid var(--bleu)}
.pass-feuille button.valider{width:100%;padding:12px;font-family:var(--f-title);letter-spacing:2px;background:var(--rouge);color:var(--papier);border:none;border-radius:2px;cursor:pointer;font-size:14px}
.pass-feuille button.valider:active{opacity:.85}
.erreur{color:var(--rouge);font-size:12px;min-height:16px;margin-top:6px}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

footer{text-align:center;padding:34px 20px calc(34px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--brun);letter-spacing:1px}
footer .etoile-secrete{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:22px;cursor:pointer;user-select:none}
footer .etoile-secrete .symbole{font-size:26px;color:var(--rouge);animation:etoilePulse 2.6s ease-in-out infinite}
footer .etoile-secrete .indice{font-family:var(--f-hand);font-size:15px;color:var(--rouge);opacity:.75}
@keyframes etoilePulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.btn-reset{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border-radius:50%;background:var(--papier);border:1px solid var(--brun);color:var(--brun);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;box-shadow:0 1px 4px var(--ombre);z-index:20}
.btn-reset:active{opacity:.9}

/* ---------- Page bonus (carnet de bal) ---------- */
.bonus-contenu{text-align:center;padding:10px 4px 4px}
.bonus-contenu h3{color:var(--bleu)}
.bonus-contenu .siecle{font-family:var(--f-hand);font-size:26px;color:var(--rouge);margin:14px 0}
</style>
</head>
<body>

<div class="hero">
  <div class="lieu">Rue des Teinturiers · Toulouse</div>
  <svg class="rays" width="220" height="34" viewBox="0 0 300 46" aria-hidden="true">
    <g fill="none" stroke="#1a1512" stroke-width="1">
      <line x1="150" y1="44" x2="20" y2="10"/><line x1="150" y1="44" x2="60" y2="4"/><line x1="150" y1="44" x2="105" y2="1"/>
      <line x1="150" y1="44" x2="150" y2="0"/><line x1="150" y1="44" x2="195" y2="1"/><line x1="150" y1="44" x2="240" y2="4"/><line x1="150" y1="44" x2="280" y2="10"/>
    </g>
    <path d="M150 14 L154 26 L166 26 L156 33 L160 45 L150 38 L140 45 L144 33 L134 26 L146 26 Z" fill="#a8201a"/>
  </svg>
  <h1>Cabaret des</h1>
  <h2 id="titreEtoiles">Étoiles</h2>
  <div class="souslegende">— la galerie de ceux qu'on y croise —</div>
  <button class="btn-code" id="btnCode">Entrer un code</button>
</div>

<div class="grid" id="grille"></div>

<footer>
  1925 · Toulouse<br>
  <span class="etoile-secrete" id="etoileSecrete">
    <span class="symbole">✦</span>
    <span class="indice">il reste une page à découvrir</span>
  </span>
</footer>
<button class="btn-reset" id="btnReset" aria-label="Réinitialiser">⟲</button>

<div class="voile" id="voileFiche"><div class="feuille" id="feuilleFiche"></div></div>
<div class="voile" id="voilePass">
  <div class="feuille pass-feuille">
    <button class="ferm" id="fermPass" aria-label="Fermer">×</button>
    <h3 id="titrePass" style="color:var(--brun)">Un chiffre ferme ce visage</h3>
    <p id="textePass">Un code à 4 chiffres, quelque part dans une enveloppe.</p>
    <input id="champPass" disabled type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="· · · ·">
    <button class="valider" id="btnValider">Déverrouiller</button>
    <div class="erreur" id="erreurPass"></div>
  </div>
</div>

<script>
/* ===================== ICONES (art déco, ligne, un détail animé) ===================== */
const ICONES = {
brush:`<svg viewBox="0 0 100 100"><g fill="none" stroke="#1a1512" stroke-width="4" stroke-linecap="round"><g class="p-brush" transform-origin="70 30"><path d="M68 20 L86 8" stroke="#5a3e1b"/><path d="M84 6 L92 14 L78 24 Z" fill="#1a1512" stroke="none"/></g><path d="M68 22 L34 56" /><path d="M30 60 C22 68 20 78 24 84 C30 88 40 86 48 78 C54 72 58 62 66 26" fill="none"/></g><circle cx="24" cy="84" r="4" fill="#a8201a"/></svg>`,

mustache:`<svg viewBox="0 0 100 100"><circle cx="50" cy="46" r="34" fill="none" stroke="#1a1512" stroke-width="4"/><circle cx="38" cy="40" r="3.5" fill="#1a1512"/><circle cx="62" cy="40" r="3.5" fill="#1a1512"/><path class="p-mustache" transform-origin="50 62" d="M20 62 C32 54 44 62 50 60 C56 62 68 54 80 62 C70 58 60 66 50 64 C40 66 30 58 20 62 Z" fill="#1a1512"/></svg>`,

const ETOILE_TIER = 4; /* mise à jour Célestin/Louise : l'étoile filante */
const AJOUT_ETOILE = `<p><strong>Cette nuit-là :</strong> une étoile filante, le 16 décembre à 0 h 48, au-dessus de Toulouse — et des conversations qui ont duré jusqu'à l'aube.</p>`;

const MOTS_DE_PASSE = {1:'1412',2:'1899',3:'0714',4:'0048',5:'1897',6:'1925'};
const MOT_BONUS = 'TOUJOURS';

/* ===================== ÉTAT ===================== */
const cle = 'ldd_tiers_debloques';
function tiersDebloques(){ try{ return JSON.parse(localStorage.getItem(cle))||[0]; }catch(e){ return [0]; } }
function debloquerTier(t){ const l=tiersDebloques(); if(!l.includes(t)){ l.push(t); localStorage.setItem(cle,JSON.stringify(l)); } }
function estDebloque(t){ return tiersDebloques().includes(t); }

const cleNouveau = 'ldd_nouveautes';
function nouveautes(){ try{ return JSON.parse(localStorage.getItem(cleNouveau))||[]; }catch(e){ return []; } }
function marquerNouveaute(ids){ const l=nouveautes(); ids.forEach(id=>{ if(!l.includes(id)) l.push(id); }); localStorage.setItem(cleNouveau, JSON.stringify(l)); }
function estNouveau(id){ return nouveautes().includes(id); }
function retirerNouveaute(id){ const l=nouveautes().filter(x=>x!==id); localStorage.setItem(cleNouveau, JSON.stringify(l)); }

let comptTaps = 0, tapsTimer = null;
document.getElementById('titreEtoiles').addEventListener('click', ()=>{
  comptTaps++;
  clearTimeout(tapsTimer);
  tapsTimer = setTimeout(()=>{ comptTaps = 0; }, 1500);
  if(comptTaps >= 4){
    comptTaps = 0;
    localStorage.setItem(cle, JSON.stringify([0,1,2,3,4,5,6]));
    rendreGrille();
  }
});

/* ===================== RENDU GRILLE ===================== */
const grille = document.getElementById('grille');
function rendreGrille(){
  grille.innerHTML='';
  PERSONNAGES.forEach(p=>{
    const ouvert = estDebloque(p.tier);
    const carte = document.createElement('button');
    carte.className = 'card' + (ouvert?'':' locked') + (ouvert && estNouveau(p.id) ? ' nouveau' : '');
    carte.dataset.id = p.id;
    carte.innerHTML = `
      <div class="medaillon">
        <svg class="frame" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#efe6d2" stroke="${ouvert?'#5a3e1b':'#a89877'}" stroke-width="2"/></svg>
        ${ouvert
          ? `<img class="foto" style="object-position:50% ${p.cadrage ?? 18}%" src="${p.photo}" alt="${p.nom}" onerror="this.style.display='none'">
             <div class="badge"><div class="icone">${ICONES[p.icon]}</div></div>`
          : `<div class="silhouette">${ICONES.owl.replace(/#1f3a5f|#a8201a/g,'#a89877')}</div>`
        }
      </div>
      <div class="nom">${ouvert ? p.nom : 'Vous ferez bientôt sa connaissance'}</div>
      <div class="role">${ouvert ? p.role : ''}</div>`;
    if(ouvert){
      carte.addEventListener('click', ()=> ouvrirFiche(p, carte));
    } else {
      carte.addEventListener('click', ()=>{
        const med = carte.querySelector('.medaillon');
        med.classList.remove('secoue'); void med.offsetWidth; med.classList.add('secoue');
      });
    }
    grille.appendChild(carte);
  });
  if(localStorage.getItem('ldd_bonus') === '1'){
    const cb = document.createElement('button');
    cb.className = 'card carte-bonus';
    cb.dataset.id = 'bonus';
    cb.innerHTML = `
      <div class="medaillon">
        <svg class="frame" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#efe6d2" stroke="#a8201a" stroke-width="2"/><circle cx="50" cy="50" r="41" fill="none" stroke="#1f3a5f" stroke-width="1"/></svg>
        <div class="icone">${ICONES.star}</div>
      </div>
      <div class="nom">Près d'un siècle plus tard</div>
      <div class="role">Le carnet de bal</div>`;
    cb.addEventListener('click', ()=>{
      const med = cb.querySelector('.medaillon');
      med.classList.add('ouvre'); setTimeout(()=>med.classList.remove('ouvre'), 600);
      cb.querySelector('.icone').classList.add('play');
      setTimeout(()=> cb.querySelector('.icone').classList.remove('play'), 900);
      setTimeout(ouvrirBonus, 250);
    });
    grille.appendChild(cb);
  }
}
rendreGrille();
if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

(function(){
  const p = new URLSearchParams(location.search).get('cb');
  if(p === MOT_BONUS){ setTimeout(()=> ouvrirBonus(), 400); }
})();

/* ===================== FICHE PERSONNAGE ===================== */
const voileFiche = document.getElementById('voileFiche');
const feuilleFiche = document.getElementById('feuilleFiche');
function ouvrirFiche(p, carte){
  document.body.style.overflow = 'hidden';
  retirerNouveaute(p.id);
  carte.classList.remove('nouveau');
  const medO = carte.querySelector('.medaillon');
  medO.classList.remove('ouvre'); void medO.offsetWidth; medO.classList.add('ouvre');
  setTimeout(()=> medO.classList.remove('ouvre'), 600);
  const icone = carte.querySelector('.icone');
  icone.classList.add('play');
  setTimeout(()=> icone.classList.remove('play'), 900);
  let extra = '';
  if(p.ajoutTier && estDebloque(p.ajoutTier)) extra += `<div class="ajout">${p.ajout}</div>`;
  if((p.id==='celestin' || p.id==='louise') && estDebloque(ETOILE_TIER)) extra += `<div class="ajout">${AJOUT_ETOILE}</div>`;
  feuilleFiche.innerHTML = `
    <button class="ferm" aria-label="Fermer">×</button>
    <img class="foto-fiche" style="object-position:50% ${p.cadrageFiche ?? p.cadrage ?? 18}%" src="${p.photo}" alt="${p.nom}" onerror="this.style.display='none'">
    <h3>${p.nom}</h3>
    <div class="sousrole">${p.role}</div>
    ${p.bio}
    ${p.citation ? `<div class="citation">${p.citation}</div>` : ''}
    ${extra}`;
  feuilleFiche.querySelector('.ferm').addEventListener('click', fermerVoiles);
  setTimeout(()=> voileFiche.classList.add('show'), 250);
}

/* ===================== MOT DE PASSE ===================== */
const voilePass = document.getElementById('voilePass');
const champPass = document.getElementById('champPass');
const erreurPass = document.getElementById('erreurPass');
let modeBonus = false;
let modeReset = false;

function ouvrirPass(bonus){
  document.body.style.overflow = 'hidden';
  modeBonus = !!bonus;
  modeReset = false;
  champPass.value=''; erreurPass.textContent='';
  if(modeBonus){
    champPass.setAttribute('inputmode','text');
    champPass.removeAttribute('maxlength');
    champPass.placeholder = '· · · · · · · ·';
    document.getElementById('titrePass').textContent = 'Un secret ferme ce visage';
    document.getElementById('textePass').textContent = "On vous a confié un mot, quelque part. Écrivez-le ici.";
  } else {
    champPass.setAttribute('inputmode','numeric');
    champPass.setAttribute('maxlength','4');
    champPass.placeholder = '· · · ·';
    document.getElementById('titrePass').textContent = 'Un chiffre ferme ce visage';
    document.getElementById('textePass').textContent = "Un code à 4 chiffres, quelque part dans une enveloppe.";
  }
  champPass.disabled = false;
  voilePass.classList.add('show');
}
function ouvrirReset(){
  document.body.style.overflow = 'hidden';
  modeBonus = false;
  modeReset = true;
  champPass.value=''; erreurPass.textContent='';
  champPass.setAttribute('inputmode','numeric');
  champPass.setAttribute('maxlength','4');
  champPass.placeholder = '· · · ·';
  document.getElementById('titrePass').textContent = 'Tout réinitialiser ?';
  document.getElementById('textePass').textContent = "Entrez le code pour tout remettre à zéro.";
  champPass.disabled = false;
  voilePass.classList.add('show');
}
document.getElementById('btnReset').addEventListener('click', ouvrirReset);
document.getElementById('btnCode').addEventListener('click', ()=> ouvrirPass(false));
document.getElementById('fermPass').addEventListener('click', fermerVoiles);

document.getElementById('btnValider').addEventListener('click', validerPass);
champPass.addEventListener('keydown', e=>{ if(e.key==='Enter') validerPass(); });

function validerPass(){
  const val = champPass.value.trim().toUpperCase();
  if(!val){ return; }
  if(modeReset){
    if(val==='0000'){
      localStorage.removeItem(cle);
      localStorage.removeItem(cleNouveau);
      localStorage.removeItem('ldd_bonus');
      fermerVoiles();
      rendreGrille();
    } else erreurGraphique();
    return;
  }
  if(modeBonus){
    if(val===MOT_BONUS){ fermerVoiles(); ouvrirBonus(); }
    else erreurGraphique();
    return;
  }
  let tierTrouve = null;
  for(const t in MOTS_DE_PASSE){ if(!estDebloque(+t) && MOTS_DE_PASSE[t]===val){ tierTrouve=+t; break; } }
  if(tierTrouve){
    const idsTotal = [];
    for(let t=1; t<=tierTrouve; t++){
      if(estDebloque(t)) continue;
      debloquerTier(t);
      const ids = PERSONNAGES.filter(p=>p.tier===t).map(p=>p.id);
      if(t===ETOILE_TIER) ids.push('celestin','louise');
      PERSONNAGES.forEach(p=>{ if(p.ajoutTier===t) ids.push(p.id); });
      idsTotal.push(...ids);
    }
    marquerNouveaute(idsTotal);
    fermerVoiles();
    rendreGrille();
    idsTotal.forEach(id=>{
      const med = grille.querySelector('[data-id="'+id+'"] .medaillon');
      if(med){ med.classList.add('eclat'); setTimeout(()=>med.classList.remove('eclat'), 1300); }
    });
  }
  else erreurGraphique();
}
function erreurGraphique(){
  erreurPass.textContent = 'Ce mot ne correspond à aucun secret pour l\u2019instant.';
  const feuille = voilePass.querySelector('.feuille'); feuille.classList.remove('shake'); void feuille.offsetWidth; feuille.classList.add('shake');
}

/* ===================== BONUS — carnet de bal ===================== */
document.getElementById('etoileSecrete').addEventListener('click', ()=> ouvrirPass(true));

function ouvrirBonus(){
  document.body.style.overflow = 'hidden';
  const dejaVu = localStorage.getItem('ldd_bonus') === '1';
  try{ localStorage.setItem('ldd_bonus','1'); }catch(e){}
  if(!dejaVu) setTimeout(rendreGrille, 300);
  feuilleFiche.innerHTML = `
    <button class="ferm" aria-label="Fermer">×</button>
    <div class="bonus-contenu">
      <h3>Le carnet de bal</h3>
      <p>Une dernière page, glissée entre les autres.</p>
      <div class="siecle">Toulouse, près d'un siècle plus tard.</div>
      <p>Les mêmes rues, la même Garonne, et une dernière danse qui, cette fois, ne s'arrête pas.</p>
    </div>`;
  feuilleFiche.querySelector('.ferm').addEventListener('click', fermerVoiles);
  setTimeout(()=> voileFiche.classList.add('show'), 50);
}

function fermerVoiles(){
  champPass.blur();
  champPass.disabled = true;
  document.body.style.overflow = '';
  voileFiche.classList.remove('show');
  voilePass.classList.remove('show');
}
voileFiche.addEventListener('click', e=>{ if(e.target===voileFiche) fermerVoiles(); });
