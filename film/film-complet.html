<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Dernière Danse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=La+Belle+Aurore&family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Salle de projection : l'écran au centre, les quatorze plans en bobines dessous. Volontairement sombre. */
:root{
  --room:#120e0b;--frame:#1a1512;--edge:#3a2e22;--cream:#f1e7d3;--muted:#b9a98c;--gold:#e3b23c;--red:#a8201a;
  --display:'Limelight',Georgia,serif;--body:'Bodoni Moda',Georgia,serif;--type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
html,body{background:var(--room);color:var(--cream);margin:0}
body{font-family:var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.eyebrow{font-family:var(--type);font-size:12px;letter-spacing:.22em;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,64px);line-height:1.05;margin:0}
.sub{margin:0;font-family:'La Belle Aurore',cursive;font-size:clamp(22px,4vw,30px);color:var(--gold)}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--edge);box-shadow:0 0 0 6px var(--frame),0 0 0 7px var(--edge),0 30px 80px rgba(0,0,0,.6)}
.screen:fullscreen{border:0;box-shadow:none}
.screen:-webkit-full-screen{width:100%;height:100%;border:0;box-shadow:none}
canvas{display:block;width:100%;height:100%}
.play{position:absolute;inset:0;margin:auto;width:88px;height:88px;border-radius:50%;border:2px solid var(--gold);background:rgba(18,14,11,.72);color:var(--gold);cursor:pointer;display:grid;place-items:center;transition:transform .2s ease}
.play[hidden]{display:none}
.play:hover{transform:scale(1.06)}
.play svg{width:30px;height:30px;margin-left:5px}
.now{font-family:var(--type);font-size:13px;letter-spacing:.08em;color:var(--muted);text-align:center;min-height:1.4em}
.now b{color:var(--gold);font-weight:400}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--type);font-size:14px}
.ctl{font-family:var(--type);font-size:14px;color:var(--cream);background:transparent;border:1px solid #5a4a36;padding:10px 14px;min-height:44px;min-width:44px;cursor:pointer}
.ctl:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bar{height:14px;flex:1 1 200px;position:relative;min-width:0;cursor:pointer;display:flex;align-items:center}
.bar::before{content:'';position:absolute;left:0;right:0;height:3px;background:#2c241b}
.bar i{position:absolute;left:0;height:3px;background:var(--gold);width:0}
.bar s{position:absolute;top:2px;width:1px;height:10px;background:#5a4a36;text-decoration:none}
.tc{color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.05em}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:12px 0 0;color:var(--cream);text-align:center}
.plans{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.plans button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;background:transparent;border:1px solid #3a2e22;color:var(--cream);padding:12px 14px;min-height:44px;cursor:pointer;font-family:var(--body);font-size:16px}
.plans button:hover{border-color:var(--gold)}
.plans button[aria-current="true"]{border-color:var(--gold);background:#1f1812}
.plans .n{font-family:var(--display);color:var(--red);font-size:20px}
.plans .d{font-family:var(--type);font-size:12px;color:var(--muted)}
.retour{align-self:flex-start;font-family:var(--type);font-size:13px;color:var(--muted);text-decoration:none;padding:10px 0;min-height:44px;box-sizing:border-box}
.retour:hover{color:var(--gold)}
.note{max-width:62ch;margin:0 auto;color:var(--muted);line-height:1.6;text-align:center;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <a class="retour" id="retour" href="../index.html?cb=TOUJOURS" hidden>← Retour au carnet de bal</a>
  <header>
    <div class="eyebrow">UN FILM EN QUATORZE PLANS · D'APRÈS LE ROMAN</div>
    <h1>La Dernière Danse</h1>
    <p class="sub">Toulouse, décembre 1925</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="film" width="1280" height="720" aria-label="Le film La Dernière Danse, en silhouettes art déco, du grenier du Pont-Neuf jusqu'à près d'un siècle plus tard."></canvas>
    <button class="play" id="play" aria-label="Lancer le film">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
    </button>
  </div>
  <div class="now" id="now" aria-live="polite"></div>

  <div class="controls">
    <button class="ctl" id="prev" type="button" aria-label="Plan précédent">◀◀</button>
    <button class="ctl" id="pause" type="button">Lecture</button>
    <button class="ctl" id="next" type="button" aria-label="Plan suivant">▶▶</button>
    <div class="bar" id="bar" role="slider" aria-label="Aller au plan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="prog"></i></div>
    <span class="tc" id="tc">00:00</span>
    <button class="ctl" id="sound" type="button" aria-pressed="true">Son : activé</button>
    <button class="ctl" id="fs" type="button">Plein écran</button>
  </div>

  <h2>Les plans</h2>
  <ol class="plans" id="plans"></ol>
  <p class="note">À regarder avec le son, de préférence en plein écran, téléphone à l'horizontale. Un clic sur un plan, ou sur la barre, reprend le film au début de ce plan.</p>
</div>
<script>
/* La Dernière Danse — moteur commun des plans
   Outils mathématiques, cartons, grain de pellicule, lecteur (lecture, son, plein écran). */
(function(){
const L=window.LDD=window.LDD||{};
L.W=1280;L.H=720;
L.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
L.lerp=(a,b,t)=>a+(b-a)*t;
L.eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
L.eoc=t=>1-Math.pow(1-t,3);
L.eic=t=>t*t*t;
L.seg=(t,a,b)=>L.clamp((t-a)/(b-a),0,1);
L.rng=function(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
L.mix=function(a,b,t,al){const A=hex(a),B=hex(b);const r=Math.round(L.lerp(A[0],B[0],t)),g=Math.round(L.lerp(A[1],B[1],t)),bl=Math.round(L.lerp(A[2],B[2],t));return al==null?`rgb(${r},${g},${bl})`:`rgba(${r},${g},${bl},${al})`};
L.setLS=(c,v)=>{if('letterSpacing' in c)c.letterSpacing=v};
L.reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* Palette du roman */
L.C={papier:'#f1e7d3',encre:'#1a1512',rouge:'#a8201a',bleu:'#1f3a5f',brun:'#5a3e1b',or:'#e3b23c',ombre:'#0b0907',grisChat:'#7d7a76'};
L.F={titre:"'Limelight', Georgia, serif",texte:"'Bodoni Moda', Georgia, serif",main:"'La Belle Aurore', cursive",machine:"'Special Elite', 'Courier New', monospace"};

/* Étoile à cinq branches */
L.star=function(c,x,y,ro,ri,fill,stroke,lw){c.beginPath();for(let i=0;i<10;i++){const r=i%2?ri:ro,an=-Math.PI/2+i*Math.PI/5;c.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r)}c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}};

/* Carton de cinéma muet : lines = [{s,y,f,c,ls}], option star = y de l'étoile rouge */
L.carton=function(c,lines,a,starY){
  if(a<=0)return;const W=L.W,H=L.H;c.save();c.globalAlpha=a;
  c.strokeStyle='#b88f2e';c.lineWidth=2;c.strokeRect(70,70,W-140,H-140);c.lineWidth=1;c.strokeRect(82,82,W-164,H-164);
  [[82,82,0],[W-82,82,Math.PI/2],[W-82,H-82,Math.PI],[82,H-82,-Math.PI/2]].forEach(([x,y,r])=>{c.save();c.translate(x,y);c.rotate(r);
    for(let i=0;i<=6;i++){const an=i*Math.PI/12;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(an)*54,Math.sin(an)*54);c.stroke()}c.restore()});
  c.textAlign='center';
  for(const l of lines){c.fillStyle=l.c||L.C.papier;c.font=l.f;L.setLS(c,l.ls||'0px');c.fillText(l.s,W/2,l.y)}
  L.setLS(c,'0px');if(starY!=null)L.star(c,W/2,starY,17,7,L.C.rouge);
  c.restore();
};
/* Opacité d'un carton : apparition, tenue, disparition */
L.fade=(t,a,b,inn,out)=>t<a||t>b?0:Math.min(1,(t-a)/(inn||.6),(b-t)/(out||.6));

/* Pellicule : vignettage + grain + rayures + scintillement */
const vg=new WeakMap();
L.pellicule=function(c){
  const W=L.W,H=L.H;let g=vg.get(c);
  if(!g){g=c.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.58)');vg.set(c,g)}
  c.fillStyle=g;c.fillRect(0,0,W,H);
  if(L.reduce)return;
  for(let i=0;i<160;i++){const v=Math.random();c.fillStyle=v<.5?`rgba(241,231,211,${.03+Math.random()*.07})`:`rgba(0,0,0,${.05+Math.random()*.1})`;const s=1+Math.random()*1.8;c.fillRect(Math.random()*W,Math.random()*H,s,s)}
  if(Math.random()<.05){c.strokeStyle='rgba(241,231,211,.14)';c.lineWidth=1;const x=Math.random()*W;c.beginPath();c.moveTo(x,0);c.lineTo(x+Math.random()*6-3,H);c.stroke()}
  c.fillStyle=`rgba(0,0,0,${Math.random()*.035})`;c.fillRect(0,0,W,H);
};
/* Répliques : durée d'affichage proportionnelle à la longueur (≈ 13 caractères par seconde + 1,1 s de fondu),
   et empilement vers le haut quand une réplique suivante apparaît avant que la précédente ait disparu. */
L.lue=l=>Math.min(8,Math.max(l[3]||1.5,1.1+l[2].length/13));
L.pile=(t,lignes,l)=>{let o=0;for(const m of lignes)if(m[0]>l[0])o+=34*L.seg(t,m[0]-.25,m[0]+.1);return o};
L.noir=function(c,a){if(a>0){c.fillStyle=`rgba(0,0,0,${Math.min(1,a)})`;c.fillRect(0,0,L.W,L.H)}};

/* Plein écran : API standard, puis préfixe webkit (iPad), sinon plein écran « maison » en CSS (iPhone, où Safari
   ne met en plein écran que les vidéos). Une croix permet d'en sortir ; Échap aussi. */
L.pleinEcran=function(s){
  const d=document,natif=d.fullscreenElement||d.webkitFullscreenElement;
  if(!d.getElementById('ldd-pfs')){const st=d.createElement('style');st.id='ldd-pfs';st.textContent=
    '.pseudo-fs{position:fixed!important;inset:0!important;z-index:9999;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;aspect-ratio:auto!important;margin:0!important;border:0!important;box-shadow:none!important;background:#000!important}'+
    '.pseudo-fs canvas{object-fit:contain}.ldd-sortir{display:none}.pseudo-fs .ldd-sortir{display:grid;place-items:center;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid rgba(241,231,211,.5);background:rgba(0,0,0,.45);color:#f1e7d3;font-size:22px;line-height:1;cursor:pointer;z-index:2}'+
    'html.ldd-pfs-on,html.ldd-pfs-on body{overflow:hidden}';d.head.appendChild(st)}
  if(!s.querySelector('.ldd-sortir')){const b=d.createElement('button');b.type='button';b.className='ldd-sortir';b.setAttribute('aria-label','Quitter le plein écran');b.textContent='×';
    b.addEventListener('click',e=>{e.stopPropagation();L.pleinEcran(s)});s.appendChild(b);
    d.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.classList.contains('pseudo-fs'))L.pleinEcran(s)})}
  if(s.classList.contains('pseudo-fs')){s.classList.remove('pseudo-fs');d.documentElement.classList.remove('ldd-pfs-on');return}
  if(natif){try{const p=(d.exitFullscreen||d.webkitExitFullscreen).call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}return}
  const req=s.requestFullscreen||s.webkitRequestFullscreen;
  const maison=()=>{s.classList.add('pseudo-fs');d.documentElement.classList.add('ldd-pfs-on');try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
  if(req&&(d.fullscreenEnabled||d.webkitFullscreenEnabled)){try{const p=req.call(s);if(p&&p.catch)p.catch(maison)}catch(e){maison()}}else maison();
};

/* Lecteur : relie le canevas et les boutons de la page.
   opts = {duree, rendu(c,t), partition(ac,sortie,T), affiche, polices:[...]} */
L.film=function(opts){
  const cv=document.getElementById('film'),c=cv.getContext('2d');
  const playBtn=document.getElementById('play'),prog=document.getElementById('prog'),tc=document.getElementById('tc');
  const DUR=opts.duree;let ac=null,bus=null,muted=false,t0=0,playing=false,raf=0;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
  const draw=t=>{c.save();opts.rendu(c,t);c.restore();L.pellicule(c)};
  window.LDD_rendu=draw;
  function startAudio(){
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;return 0}
    if(ac.state==='suspended')ac.resume();
    if(bus){try{bus.gain.cancelScheduledValues(0);bus.disconnect()}catch(e){}}
    bus=ac.createGain();bus.gain.value=muted?0:1;bus.connect(ac.destination);
    try{opts.partition(ac,bus,ac.currentTime+.08)}catch(e){console.error(e)}
    return 80;
  }
  function tick(){
    let t=(performance.now()-t0)/1000;if(t>=DUR){t=DUR;playing=false}
    t=Math.max(0,t);draw(t);prog.style.width=(t/DUR*100)+'%';tc.textContent=fmt(t)+' / '+fmt(DUR);
    if(playing)raf=requestAnimationFrame(tick);else{playBtn.hidden=false;playBtn.setAttribute('aria-label','Revoir le plan')}
  }
  function play(){cancelAnimationFrame(raf);const lag=startAudio();t0=performance.now()+lag;playing=true;playBtn.hidden=true;raf=requestAnimationFrame(tick)}
  playBtn.addEventListener('click',play);
  document.getElementById('replay').addEventListener('click',play);
  const snd=document.getElementById('sound');
  snd.addEventListener('click',()=>{muted=!muted;snd.textContent='Son : '+(muted?'coupé':'activé');snd.setAttribute('aria-pressed',String(!muted));if(bus&&ac)bus.gain.setValueAtTime(muted?0:1,ac.currentTime)});
  document.getElementById('fs').addEventListener('click',()=>L.pleinEcran(document.getElementById('screen')));
  tc.textContent='00:00 / '+fmt(DUR);
  draw(opts.affiche);
  const fonts=opts.polices||["26px 'Limelight'","italic 22px 'Bodoni Moda'","20px 'Special Elite'","30px 'La Belle Aurore'"];
  if(document.fonts&&document.fonts.load){Promise.all(fonts.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>{if(!playing)draw(opts.affiche)})}
};
})();

</script>
<script>
/* La Dernière Danse — musique commune
   Instruments synthétisés (Web Audio) et « le morceau sans nom » de Léon. */
(function(){
const L=window.LDD=window.LDD||{};
L.mf=m=>440*Math.pow(2,(m-69)/12);

/* Le thème : [temps en battements, note MIDI, durée en battements] */
L.THEME={
  motif:[[0,69,1],[1,72,.5],[1.5,74,.5],[2,77,1.5],[3.5,76,.5],[4,74,1],[5,71,.5],[5.5,72,1.5]],
  reponse:[[0,72,.5],[.5,74,.5],[1,76,1],[2,79,1],[3,76,.5],[3.5,74,.5],[4,73,2]],
  lent:[[0,69,1.5],[1.5,72,.75],[2.25,74,.75],[3,77,2.5],[5.5,76,.75],[6.25,74,.75],[7,72,1.5],[8.5,69,3]],
  accords:{Dm9:[50,53,57,60,64],G13:[43,53,59,64],Cmaj9:[48,52,55,59,62],A7b9:[45,55,61,70],A7:[45,55,61,67],Fmaj9:[53,57,60,64,67],Bbmaj7:[46,53,57,62],Fadd9:[41,53,57,60,67],D69:[38,50,57,62,66,69,71,74],Am9:[45,48,52,55,59]},
  basses:{Dm9:[38,40,41,45],G13:[43,45,47,50],Cmaj9:[36,38,40,43],A7b9:[45,49,52,43],A7:[45,47,49,52]},
  grille:['Dm9','G13','Cmaj9','A7b9']
};

/* Trousse d'instruments reliée à une sortie */
L.kit=function(ac,sortie){
  const out=ac.createGain();out.connect(sortie);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const lp=f=>{const n=ac.createBiquadFilter();n.type='lowpass';n.frequency.value=f;return n};
  const env=(g,t0,a,peak,dec)=>{g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec)};
  const K={ac,out,nb,lp,env,mf:L.mf,
    bus(){const g=ac.createGain();g.connect(out);return g},
    noise(w,dur,type,f,q,g0,att,dest){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,w);g.gain.linearRampToValueAtTime(g0,w+att);g.gain.exponentialRampToValueAtTime(0.0001,w+att+dur);s.connect(fl).connect(g).connect(dest||out);s.start(w,Math.random()*1.5);s.stop(w+att+dur+.05);return g},
    /* bruit continu filtré ; points = [[temps, gain], …] (paliers linéaires) */
    nappe(T,fin,type,f,q,points,dest){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();
      g.gain.setValueAtTime(0,T);points.forEach(([t,v])=>g.gain.linearRampToValueAtTime(v,T+t));s.connect(fl).connect(g).connect(dest||out);s.start(T);s.stop(T+fin);return g},
    /* ronronnement du projecteur, avec silences [[de, à], …] */
    projecteur(T,fin,silences){const pts=[[.6,.016]];(silences||[]).forEach(([a,b])=>{pts.push([a,.016],[a+.15,0],[b,0],[b+1,.014])});pts.push([fin-.6,.014],[fin,0]);return K.nappe(T,fin+.2,'bandpass',2400,.6,pts)},
    gramophone(T,fin){K.nappe(T,fin,'bandpass',3200,.4,[[.3,.03],[fin-.4,.03],[fin,0]]);
      for(let i=0;i<fin*5;i++){const w=T+Math.random()*fin;K.noise(w,.012,'highpass',3000,.5,.02+Math.random()*.05,.001)}},
    piano(m,w,g0,dest){const o=ac.createOscillator();o.type='triangle';o.frequency.value=L.mf(m);const g=ac.createGain();env(g,w,.006,g0==null?.03:g0,1.3);o.connect(lp(2300)).connect(g).connect(dest||out);o.start(w);o.stop(w+1.5)},
    accord(nom,w,g0,dest){L.THEME.accords[nom].forEach(m=>K.piano(m,w,g0,dest))},
    basse(m,w,dest,g0){const o=ac.createOscillator();o.type='sine';o.frequency.value=L.mf(m);const g=ac.createGain();env(g,w,.01,g0||.2,.5);o.connect(g).connect(dest||out);o.start(w);o.stop(w+.65)},
    grosseCaisse(w,dest){const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(110,w);o.frequency.exponentialRampToValueAtTime(45,w+.12);const g=ac.createGain();env(g,w,.003,.18,.18);o.connect(g).connect(dest||out);o.start(w);o.stop(w+.25)},
    charleston(w,dest,g0){K.noise(w,.08,'highpass',7000,.7,g0||.045,.002,dest)},
    roulement(a,b,dest){for(let w=a;w<b;w+=.045)K.noise(w,.04,'bandpass',1800,.8,.008+.03*((w-a)/(b-a)),.003,dest)},
    cymbale(w,dest,g0,dur){K.noise(w,dur||1.8,'highpass',4500,.5,g0||.08,.004,dest)},
    /* trompette (ou violon avec d'autres réglages) */

  if(o.chapeau!==false){c.fillStyle='#050403';c.fillRect(-40,-96,44,40);c.beginPath();c.ellipse(-18,-96,32,7,0,0,7);c.fill();
    c.fillStyle='#2a1d14';c.beginPath();c.ellipse(-18,-96,22,4,0,0,7);c.fill();c.fillStyle=L.C.rouge;c.fillRect(-40,-66,44,5)}
  // bras droit
  const m=o.main||{x:52,y:-96};
  c.strokeStyle=col;c.lineWidth=13;c.beginPath();c.moveTo(40,-148-r);const ex=(40+m.x)/2+18,ey=(-148-r+m.y)/2+10;c.quadraticCurveTo(ex,ey,m.x,m.y);c.stroke();
  c.fillStyle=col;c.beginPath();c.arc(m.x,m.y,7,0,7);c.fill();

};

/* Amélie Sarrail, la grand-mère : chignon haut, robe longue, ras-de-cou de perles.
   o = {F (sens), s (échelle), pointe 0..1 (bras tendu, doigt accusateur), tempe 0..1 (main sur la tempe : la migraine stratégique)} */
L.amelie=function(c,x,sol,o){
  o=o||{};const F=o.F||1,s=o.s||1,col='#100b09';

  const ap=lerp(.25,1.75,p);c.beginPath();c.moveTo(F*6,-164);c.lineTo(F*(6+Math.sin(ap)*30),-164+Math.cos(ap)*30);c.lineTo(F*(6+Math.sin(ap)*58),-164+Math.cos(ap)*58-(p*6));c.stroke();
  if(tp>0){c.beginPath();c.moveTo(-F*6,-164);c.lineTo(-F*(14+10*tp),-150-20*tp);c.lineTo(F*lerp(-12,-4,tp),lerp(-130,-198,tp));c.stroke()}
  else{c.beginPath();c.moveTo(-F*6,-164);c.lineTo(-F*12,-136);c.lineTo(-F*6,-112);c.stroke()}
  c.restore();
};

/* Chopin, grand chat gris assis, de face. queue = phase, cligne = 0..1 */
L.chopin=function(c,x,y,s,queue,cligne){
  c.save();c.translate(x,y);c.scale(s,s);const g=L.C.grisChat;
  c.strokeStyle=g;c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(40,-6);

  c.fillStyle=g;c.beginPath();c.moveTo(-40,0);c.quadraticCurveTo(-48,-66,-18,-96);c.lineTo(18,-96);c.quadraticCurveTo(50,-66,42,0);c.closePath();c.fill();
  c.beginPath();c.arc(0,-124,34,0,7);c.fill();
  c.beginPath();c.moveTo(-30,-140);c.lineTo(-34,-178);c.lineTo(-8,-154);c.closePath();c.fill();c.beginPath();c.moveTo(30,-140);c.lineTo(34,-178);c.lineTo(8,-154);c.closePath();c.fill();
  const o=1-(cligne||0);
  c.fillStyle=L.C.or;c.beginPath();c.ellipse(-14,-126,8,9*o+.5,0,0,7);c.fill();c.beginPath();c.ellipse(14,-126,8,9*o+.5,0,0,7);c.fill();
  c.fillStyle=L.C.ombre;c.beginPath();c.ellipse(-14,-126,2,7*o+.3,0,0,7);c.fill();c.beginPath();c.ellipse(14,-126,2,7*o+.3,0,0,7);c.fill();
  c.fillStyle=L.C.rouge;c.beginPath();c.moveTo(-4,-110);c.lineTo(4,-110);c.lineTo(0,-105);c.fill();
  c.strokeStyle='rgba(241,231,211,.7)';c.lineWidth=1;[[-1,-4],[-1,4],[1,-4],[1,4]].forEach(([d,o2])=>{c.beginPath();c.moveTo(d*20,-106+o2*.6);c.lineTo(d*42,-108+o2*1.5);c.stroke()});
  c.restore();
};
})();

<script>
/* La Dernière Danse — décors communs
   Ciel de nuit toulousain, silhouette de la ville, collines, scène du Cabaret des Étoiles, public. */
(function(){
const L=window.LDD=window.LDD||{};
const W=1280,H=720;

/* ---------- la nuit ---------- */
const R=L.rng(1612);
const ETOILES=[];for(let i=0;i<260;i++)ETOILES.push({x:R()*W*1.7-W*.35,y:R()*560-60,s:.5+R()*1.5,p:R()*6.28,sp:.6+R()*2.2});
const GEMEAUX=[{x:318,y:104,s:3.2},{x:352,y:126,s:3.6}];

/* d = 0 (pleine nuit) → 1 (aube) */
L.ciel=function(c,d,horizon){
  horizon=horizon||480;const g=c.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,L.mix('#060b15','#2b3a55',d));g.addColorStop(.6,L.mix('#11203a','#6d5a6c',d));g.addColorStop(1,L.mix('#1f3a5f','#e0995a',d));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  if(d>0){const rg=c.createRadialGradient(1060,horizon,10,1060,horizon,460);rg.addColorStop(0,`rgba(240,190,90,${.45*d})`);rg.addColorStop(1,'rgba(240,190,90,0)');c.fillStyle=rg;c.fillRect(0,0,W,H)}
};
/* rot = rotation de la voûte (radians), gem = afficher les Gémeaux, maxY = bas des étoiles */
L.etoiles=function(c,t,d,rot,gem,maxY){
  rot=rot||0;maxY=maxY||470;const px=W*.55,py=-900,cs=Math.cos(rot),sn=Math.sin(rot),base=1-.88*d;
  const tr=(x,y)=>{const dx=x-px,dy=y-py;return[px+dx*cs-dy*sn,py+dx*sn+dy*cs]};
  for(const s of ETOILES){const[x,y]=tr(s.x,s.y);if(x<-4||x>W+4||y<-4||y>maxY)continue;
    c.fillStyle=`rgba(241,231,211,${base*(.5+.5*Math.sin(t*s.sp+s.p))})`;c.fillRect(x,y,s.s,s.s)}
  if(gem!==false)for(const s of GEMEAUX){const[x,y]=tr(s.x,s.y);c.fillStyle=`rgba(255,246,225,${base})`;c.beginPath();c.arc(x,y,s.s*.6,0,7);c.fill();
    c.strokeStyle=`rgba(255,246,225,${base*.45})`;c.lineWidth=1;c.beginPath();c.moveTo(x-s.s*2.4,y);c.lineTo(x+s.s*2.4,y);c.moveTo(x,y-s.s*2.4);c.lineTo(x,y+s.s*2.4);c.stroke()}
};
/* Toulouse au loin : toits, clocher de Saint-Sernin, dôme de la Grave. b = centre, y = horizon, k = échelle */
L.toulouse=function(c,b,y,d,k,couleurs){
  k=k||1;c.save();c.translate(b,y);c.scale(k,k);
  c.fillStyle=couleurs&&couleurs.fond||L.mix('#15253b','#3b3446',d);
  c.beginPath();c.moveTo(-260,0);
  [[-260,-10],[-220,-16],[-170,-12],[-130,-20],[-90,-14],[-40,-18],[30,-12],[80,-22],[140,-14],[200,-10],[260,-6]].forEach(r=>{c.lineTo(r[0],r[1]);c.lineTo(r[0]+38,r[1])});
  c.lineTo(300,0);c.closePath();c.fill();
  const sx=-60;[[22,14],[18,12],[14,11],[11,10],[8,9]].reduce((yy,[w,h])=>{c.fillRect(sx-w/2,yy-h,w,h);return yy-h},-14);
  c.beginPath();c.moveTo(sx-6,-70);c.lineTo(sx,-104);c.lineTo(sx+6,-70);c.fill();
  c.beginPath();c.arc(120,-30,20,Math.PI,0);c.fill();c.fillRect(100,-30,40,10);c.fillRect(117,-58,6,10);
  const lit=1-d;if(lit>0){c.fillStyle=`rgba(227,178,60,${.8*lit})`;[[-200,-8],[-118,-12],[-30,-10],[46,-6],[96,-14],[170,-8]].forEach(w=>c.fillRect(w[0],w[1],2.2,2.2))}
  c.restore();
};
L.colline=(wx,base,amp,f1,f2)=>base+amp*Math.sin(wx/f1)+amp*.5*Math.sin(wx/f2+1.3);
L.collines=function(c,ox,f,base,amp,f1,f2,col){c.fillStyle=col;c.beginPath();c.moveTo(-20,H);for(let sx=-20;sx<=W+20;sx+=16)c.lineTo(sx,L.colline(sx+ox*f,base,amp,f1,f2));c.lineTo(W+20,H);c.closePath();c.fill()};
const CYPRES=[];for(let k=0;k<14;k++)CYPRES.push({wx:k*230+((k*97)%120)-200,h:58+((k*53)%40)});
L.cypres=function(c,ox,f,base,amp,f1,f2,col){c.fillStyle=col;for(const cp of CYPRES){const sx=cp.wx-ox*f;if(sx<-30||sx>W+30)continue;const gy=L.colline(cp.wx,base,amp,f1,f2)+6;c.beginPath();c.ellipse(sx,gy-cp.h/2,8,cp.h/2,0,0,7);c.fill()}};

/* ---------- le Cabaret des Étoiles ---------- */
/* o = {spot 0..1, X (centre du projecteur), rayon(i) → 0..1 (rayons allumés), etoile 0..1, pulse, enseigne 0..1} */
L.cabaret=function(c,o){
  const RC={x:640,y:560},SOL=L.SOL;
  const g=c.createLinearGradient(0,0,0,560);g.addColorStop(0,'#160c0a');g.addColorStop(1,'#2e1410');c.fillStyle=g;c.fillRect(0,0,W,560);
  for(let i=0;i<24;i++){
    const a0=Math.PI+(i+.5)*Math.PI/24-.022,a1=a0+.044,v=o.rayon?o.rayon(i):0;
    c.fillStyle=v>0?`rgba(227,178,60,${.12+.55*v})`:'rgba(90,62,27,.35)';
    c.beginPath();c.moveTo(RC.x,RC.y);c.lineTo(RC.x+Math.cos(a0)*760,RC.y+Math.sin(a0)*760);c.lineTo(RC.x+Math.cos(a1)*760,RC.y+Math.sin(a1)*760);c.closePath();c.fill();
  }
  c.strokeStyle='rgba(227,178,60,.28)';c.lineWidth=2;[120,190].forEach(r=>{c.beginPath();c.arc(RC.x,RC.y,r,Math.PI,0);c.stroke()});
  const s=o.etoile||0;if(s>0){
    const k=s*(o.pulse||1);c.save();c.translate(RC.x,RC.y-215);c.scale(k,k);
    c.globalCompositeOperation='lighter';const gl=c.createRadialGradient(0,0,0,0,0,130);gl.addColorStop(0,'rgba(255,220,150,.55)');gl.addColorStop(1,'rgba(255,220,150,0)');c.fillStyle=gl;c.beginPath();c.arc(0,0,130,0,7);c.fill();
    c.globalCompositeOperation='source-over';L.star(c,0,0,68,28,L.C.rouge,L.C.or,3);c.restore();
  }
  c.fillStyle=L.C.or;c.font="26px "+L.F.titre;c.textAlign='center';L.setLS(c,'6px');
  c.globalAlpha=o.enseigne==null?1:o.enseigne;c.fillText('CABARET DES ÉTOILES',640,112);c.globalAlpha=1;L.setLS(c,'0px');
  const fg=c.createLinearGradient(0,560,0,720);fg.addColorStop(0,'#2a1c13');fg.addColorStop(1,'#120b07');c.fillStyle=fg;c.fillRect(0,560,W,160);
  c.strokeStyle='rgba(227,178,60,.08)';c.lineWidth=1;for(let i=-10;i<=10;i++){c.beginPath();c.moveTo(640+i*40,560);c.lineTo(640+i*130,720);c.stroke()}
  c.fillStyle=L.C.or;c.fillRect(0,558,W,3);
  const spot=o.spot||0,X=o.X||640;
  if(spot>0){
    c.save();c.globalCompositeOperation='lighter';
    const cg=c.createLinearGradient(0,0,0,620);cg.addColorStop(0,`rgba(255,240,210,${.02*spot})`);cg.addColorStop(1,`rgba(255,240,210,${.13*spot})`);
    c.fillStyle=cg;c.beginPath();c.moveTo(X-40,0);c.lineTo(X+40,0);c.lineTo(X+200,SOL);c.lineTo(X-200,SOL);c.closePath();c.fill();
    const fl=c.createRadialGradient(X,SOL,10,X,SOL,220);fl.addColorStop(0,`rgba(255,240,210,${.4*spot})`);fl.addColorStop(1,'rgba(255,240,210,0)');
    c.fillStyle=fl;c.beginPath();c.ellipse(X,SOL,220,34,0,0,7);c.fill();c.restore();
  }
  [[0,1],[W,-1]].forEach(([x0,dir])=>{for(let i=0;i<6;i++){const x=x0+dir*i*24;c.fillStyle=i%2?'#5e110d':'#7a1813';c.beginPath();c.moveTo(x,0);c.lineTo(x+dir*26,0);c.quadraticCurveTo(x+dir*(30+i*4),360,x+dir*(16+i*6),720);c.lineTo(x,720);c.closePath();c.fill()}});
  c.fillStyle='#0f0a08';c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.lineTo(W,48);for(let i=0;i<=8;i++){c.lineTo(W-150-i*122,48+(i%2?14:0))}c.lineTo(0,48);c.closePath();c.fill();
  c.strokeStyle='#b88f2e';c.lineWidth=2;c.beginPath();c.moveTo(150,60);c.lineTo(W-150,60);c.stroke();
};

/* Le public, de dos, au premier plan. bravo = 0..1 (applaudit) */
const RP=L.rng(1412);
const TETES=[];for(let i=0;i<22;i++)TETES.push({x:i*62+((i*37)%30)-10,r:24+((i*13)%8),chapeau:i%3===0,plume:i%7===3,ph:RP()*6});
L.public=function(c,t,bravo){
  c.fillStyle='#050403';
  for(const h of TETES){const by=bravo?Math.abs(Math.sin(t*9+h.ph))*-7*bravo:Math.sin(t*1.3+h.ph)*1.5,y=724+by;
    c.beginPath();c.arc(h.x,y-h.r*.4,h.r,0,7);c.fill();c.fillRect(h.x-h.r*1.3,y,h.r*2.6,40);
    if(h.chapeau){c.beginPath();c.ellipse(h.x,y-h.r*.9,h.r*1.15,h.r*.55,0,Math.PI,0);c.fill()}
    if(h.plume){c.beginPath();c.moveTo(h.x+6,y-h.r*1.2);c.quadraticCurveTo(h.x+22,y-h.r*2.6,h.x+10,y-h.r*3);c.quadraticCurveTo(h.x+14,y-h.r*2,h.x+2,y-h.r*1.2);c.fill()}
    if(bravo>0){c.beginPath();c.arc(h.x+(Math.sin(t*18+h.ph)>0?10:4),y-h.r*1.6,6,0,7);c.fill()}}
};

/* ---------- la maison Sarrail, à Purpan ----------
   Géométrie reprise telle quelle du plan coté de l'enveloppe 3 (« Étude de résistance — glycine »,
   plan n° 0714) : coordonnées du plan (1 unité = 10 mm à l'échelle 1:50 du dessin). */
L.SARRAIL={
  facade:{x:110,y:170,w:560,h:470},sol:640,cordon:400,
  toit:[[90,170],[390,70],[690,170]],
  etage:[140,245,350,475,580].map(x=>({x,y:240,w:60,h:110})),
  rdc:[140,245,475,580].map(x=>({x,y:470,w:60,h:110})),

  louise:2,grandPere:2,

  branches:['M434 520 C 410 512, 400 500, 392 486','M430 350 C 418 346, 414 338, 412 330','M458 420 C 482 410, 492 398, 500 384','M456 300 C 480 292, 494 280, 502 262'],
  pattes:[588,528,468,408,348,288],patteBranlante:468,fourche:{x:444,y:410}
};
const GRAPPES_S=(function(){const R=L.rng(714),g=[];for(let i=0;i<40;i++){const y=200+R()*420,x=432+(R()-.5)*(y<300?110:80)+(y<300?20:0);g.push({x,y,l:5+R()*7,c:R()<.5?'#6b4a8a':'#8a6aaa'})}return g})();
/* Dessine la façade de nuit, en coordonnées du plan (l'appelant choisit l'échelle).
   o = {lumLouise 0..1, ouvre 0..1 (fenêtre de Louise), lumGP 0..1 (fenêtre du grand-père, rez-de-chaussée), ombreGP true, grappes true} */
L.maisonSarrail=function(c,o){
  o=o||{};const S=L.SARRAIL,f=S.facade;
  c.fillStyle='#16121a';c.beginPath();c.moveTo(...S.toit[0]);c.lineTo(...S.toit[1]);c.lineTo(...S.toit[2]);c.closePath();c.fill();
  c.fillStyle='#3a3026';c.fillRect(f.x,f.y,f.w,f.h);
  c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=.5;for(let y=f.y+8;y<S.sol;y+=8){c.beginPath();c.moveTo(f.x,y);c.lineTo(f.x+f.w,y);c.stroke()}
  c.fillStyle='#4a3d30';c.fillRect(f.x-4,S.cordon-3,f.w+8,6);c.fillRect(f.x-6,f.y-4,f.w+12,6);
  const fen=(r,lum,ouv)=>{c.fillStyle=lum>0?L.mix('#0c0908','#c99a52',lum):'#0c0908';c.fillRect(r.x,r.y,r.w,r.h);
    c.fillStyle='#3b3f45';const lw=r.w/2*(1-.85*(ouv||0)); /* volets gris (ch. 4) */c.fillRect(r.x,r.y,lw,r.h);c.fillRect(r.x+r.w-lw,r.y,lw,r.h);
    c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1;for(let y=r.y+8;y<r.y+r.h;y+=9){c.beginPath();c.moveTo(r.x,y);c.lineTo(r.x+lw,y);c.moveTo(r.x+r.w-lw,y);c.lineTo(r.x+r.w,y);c.stroke()}
    if(lum>0&&lw>4){c.fillStyle=`rgba(255,200,120,${.35*lum})`;c.fillRect(r.x+3,r.y+3,lw-6,r.h-6);c.fillRect(r.x+r.w-lw+3,r.y+3,lw-6,r.h-6)}
    c.strokeStyle='#2a1a10';c.lineWidth=3;c.strokeRect(r.x,r.y,r.w,r.h);c.fillStyle='#4a3d30';c.fillRect(r.x-6,r.y+r.h,r.w+12,5)};
  S.etage.forEach((r,i)=>fen(r,i===S.louise?(o.lumLouise||0):0,i===S.louise?o.ouvre:0));
  S.rdc.forEach((r,i)=>fen(r,i===S.grandPere?(o.lumGP||0):0,0));
  if(o.ombreGP&&o.lumGP>0){const r=S.rdc[S.grandPere],a=o.lumGP;c.fillStyle=`rgba(20,12,8,${.85*a})`;c.beginPath();c.arc(r.x+22,r.y+40,8,0,7);c.fill();c.fillRect(r.x+14,r.y+48,16,62);
    c.fillStyle=`rgba(240,230,210,${.9*a})`;c.fillRect(r.x+30,r.y+36,24,30)}

  c.beginPath();c.arc(p.x+p.w/2,p.y,p.w/2,Math.PI,0);c.fillStyle='#3a3026';c.fill();
  // glycine : deux tiges, branches, pattes de scellement, grappes
  c.strokeStyle='#2a1d12';c.lineCap='round';c.lineJoin='round';
  c.lineWidth=7;c.stroke(new Path2D(S.tiges[0]));c.lineWidth=5.5;c.stroke(new Path2D(S.tiges[1]));
  c.lineWidth=3;S.branches.forEach(b=>c.stroke(new Path2D(b)));
  c.fillStyle='#16110c';S.pattes.forEach(y=>c.fillRect(426,y,12,5));
  if(o.grappes!==false)GRAPPES_S.forEach(g=>{c.fillStyle=g.c;c.beginPath();c.ellipse(g.x,g.y+g.l,2.6,g.l,0,0,7);c.fill()});
};

/* L'affiche du concours, identique à celle de l'enveloppe 0 (559 × 794, coordonnées de l'artefact).
   L'appelant place et met à l'échelle. */
L.afficheConcours=function(c){

  c.textAlign='center';c.fillStyle=I;

<script>/* ——— plan 01 ——— */
/* Plan 01 — Ouverture (20 s)
   Le soleil art déco se lève, l'étoile rouge s'allume comme un néon, le titre s'écrit lettre par lettre,
   puis l'iris se referme sur l'étoile. */
(function(){
const L=LDD,{clamp,lerp,eio,eoc,seg}=L,W=L.W,H=L.H;
const CX=640,CY=770,ETOILE={x:640,y:236};
const TITRE='LA DERNIÈRE DANSE',T0=6.2,PAS=.2;

function etoileAllumee(t){
  if(t<4.4)return 0;
  if((t>4.6&&t<4.72)||(t>4.86&&t<4.98))return .25;
  return Math.min(1,(t-4.4)/.15);
}
function soleil(c,t){
  const r=900*eoc(seg(t,1.4,6)),rot=-.06+.03*Math.sin(t*.25);
  if(r<=0)return;
  L.soleil(c,{x:CX,y:CY,r,n:40,rot,epais:.032,couleur:i=>i%2?'rgba(90,62,27,.55)':'rgba(227,178,60,.42)'});
  const g=c.createRadialGradient(CX,CY,0,CX,CY,r*.6);g.addColorStop(0,'rgba(227,178,60,.35)');g.addColorStop(1,'rgba(227,178,60,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle=L.C.or;c.lineWidth=2;
  [[200,2.2],[290,2.7],[380,3.2]].forEach(([rr,d])=>{const p=eio(seg(t,d,d+1.4));if(p<=0)return;c.globalAlpha=.6;c.beginPath();c.arc(CX,CY,rr,Math.PI,Math.PI+Math.PI*p);c.stroke();c.globalAlpha=1});
  c.fillStyle=L.C.ombre;c.beginPath();c.arc(CX,CY,150,Math.PI,0);c.fill();
  c.strokeStyle=L.C.or;c.lineWidth=3;c.beginPath();c.arc(CX,CY,150*eoc(seg(t,1.6,3)),Math.PI,0);c.stroke();
}
function etoile(c,t){
  const a=etoileAllumee(t);if(a<=0)return;
  const k=1+.04*Math.sin((t-5)*3);
  c.save();c.globalCompositeOperation='lighter';
  const g=c.createRadialGradient(ETOILE.x,ETOILE.y,0,ETOILE.x,ETOILE.y,170);g.addColorStop(0,`rgba(255,120,90,${.45*a})`);g.addColorStop(1,'rgba(255,120,90,0)');
  c.fillStyle=g;c.beginPath();c.arc(ETOILE.x,ETOILE.y,170,0,7);c.fill();c.restore();
  c.save();c.globalAlpha=.35+.65*a;L.star(c,ETOILE.x,ETOILE.y,64*k,26*k,L.C.rouge,L.C.or,3);c.restore();
}
function titre(c,t){
  c.save();c.font="96px "+L.F.titre;L.setLS(c,'4px');c.textAlign='left';c.textBaseline='alphabetic';
  const larg=c.measureText(TITRE).width;let x=CX-larg/2;
  for(let i=0;i<TITRE.length;i++){
    const ch=TITRE[i],w=c.measureText(ch).width,ti=T0+i*PAS,p=seg(t,ti,ti+.5);
    if(p>0&&ch!==' '){
      c.globalAlpha=p;c.fillStyle=L.C.papier;c.fillText(ch,x,430-18*(1-eoc(p)));
      const eclat=1-seg(t,ti,ti+.7);
      if(eclat>0){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=eclat;c.fillStyle='rgba(255,215,120,.9)';c.beginPath();c.arc(x+w/2,350,3+eclat*5,0,7);c.fill();c.restore()}
    }
    x+=w;
  }
  c.restore();
  const fin=T0+TITRE.length*PAS,pl=eio(seg(t,fin,fin+1.3));
  if(pl>0){c.strokeStyle=L.C.or;c.lineWidth=1.5;
    [462,470].forEach((y,k)=>{const l=(420-k*40)*pl;c.beginPath();c.moveTo(CX-30,y);c.lineTo(CX-30-l,y);c.moveTo(CX+30,y);c.lineTo(CX+30+l,y);c.stroke()});
    c.fillStyle=L.C.or;c.beginPath();c.moveTo(CX,458);c.lineTo(CX+9,466);c.lineTo(CX,474);c.lineTo(CX-9,466);c.closePath();c.globalAlpha=pl;c.fill();c.globalAlpha=1}
  const sa=seg(t,fin+.6,fin+1.8);
  if(sa>0){c.save();c.globalAlpha=sa;c.fillStyle='#d9c9a8';c.font="22px "+L.F.machine;L.setLS(c,'8px');c.textAlign='center';c.fillText('TOULOUSE · DÉCEMBRE 1925',CX,522);c.restore()}
}
function iris(c,t){
  const p=seg(t,16.8,19.4);if(p<=0)return;
  const r=lerp(1500,0,eio(p));
  c.fillStyle='#000';c.beginPath();c.rect(0,0,W,H);c.arc(ETOILE.x,ETOILE.y,Math.max(0,r),0,Math.PI*2,true);c.fill('evenodd');
  if(r>2){c.strokeStyle='rgba(227,178,60,.5)';c.lineWidth=2;c.beginPath();c.arc(ETOILE.x,ETOILE.y,r,0,7);c.stroke()}
}

function rendu(c,t){
  c.fillStyle=L.C.ombre;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=seg(t,.8,3)*.8;L.etoiles(c,t,0,0,false,700);c.restore();
  soleil(c,t);
  const point=seg(t,.3,1)*(1-seg(t,1.4,2.2));
  if(point>0){c.save();c.globalCompositeOperation='lighter';c.fillStyle=`rgba(255,215,120,${point})`;c.beginPath();c.arc(CX,700,4,0,7);c.fill();c.restore()}
  etoile(c,t);titre(c,t);iris(c,t);
  L.noir(c,t<.4?1-t/.4:t>19.4?1:0);
}

function partition(ac,sortie,T){
  const K=L.kit(ac,sortie),TH=L.THEME;
  K.gramophone(T,20);
  K.phrase(TH.motif,T+2.4,.72,'trompette',null,.055);
  K.cloche(93,T+4.42,null,.035);K.cloche(98,T+5.0,null,.025);
  K.nappe(T+4.2,1.6,'highpass',5000,.5,[[0,.0001],[.25,.03],[1.5,0]]);
  const lettres=[81,84,86,88,91,93,96,93,91,88,86,84,81,84,86,88,93];
  for(let i=0;i<TITRE.length;i++)if(TITRE[i]!==' ')K.piano(lettres[i%lettres.length],T+T0+i*PAS,.018);
  const acc=K.bus();
  K.nappeAccord('Dm9',T+9.2,4,acc,.01);K.nappeAccord('G13',T+12.8,3.4,acc,.01);K.nappeAccord('Dm9',T+15.8,4,acc,.012);
  K.phrase(TH.reponse,T+10.4,.72,'trompette',null,.045);
  K.basse(38,T+15.8,null,.18);K.accord('Dm9',T+15.8,.035);K.cloche(86,T+16,null,.03);
  K.finale(T,20);
}

L.film({duree:20,rendu,partition,affiche:14});
})();

<script>/* ——— plan 02 ——— */
/* Plan 02 — L'atelier du Pont-Neuf (34 s) — chapitre 1
   Toulouse la nuit : la Garonne, le Pont-Neuf et ses oculi ; travelling jusqu'à la fenêtre en demi-lune.
   Dans le grenier : Célestin peint la Garonne sous la pluie. Julien monte avec une bouteille et parle du concours.
   Quand il est parti, Célestin retourne la toile contre le mur, pose une toile vierge et reste devant jusqu'à deux heures,
   « d'attendre un modèle qui n'était pas encore arrivé ». */
(function(){
const L=LDD,{clamp,lerp,eio,eoc,seg}=L,W=L.W,H=L.H;
const EAU=470,TABLIER=380,FEN={x:175,y:140,r:52};

/* ---------- caméra ---------- */
function camera(t){
  const p1=eio(seg(t,3.6,8.6)),p2=eio(seg(t,8.6,11.4));
  const cx=lerp(lerp(1640,640,p1),FEN.x+8,p2),cy=lerp(360,FEN.y-24,p2),z=Math.exp(Math.log(3.5)*p2);
  return{cx,cy,z};
}

/* ---------- le Pont-Neuf : sept arches inégales et leurs oculi ---------- */
const ARCHES=[];(function(){let x=640;[150,190,230,250,230,190,150].forEach((sp,i)=>{x+=40;ARCHES.push({cx:x+sp/2,sp,rise:Math.min(78,sp*.36)});x+=sp});ARCHES.fin=x+40})();
const LANTERNES=[660,860,1100,1360,1620,1870,2090,2310];
function pont(c,t){
  c.fillStyle='#2b1813';c.beginPath();c.rect(640,TABLIER,ARCHES.fin-640,EAU-TABLIER+2);
  ARCHES.forEach(a=>{c.moveTo(a.cx+a.sp/2,EAU+2);c.ellipse(a.cx,EAU+2,a.sp/2,a.rise,0,0,Math.PI,true);c.closePath()});
  ARCHES.slice(0,-1).forEach(a=>{const x=a.cx+a.sp/2+20;c.moveTo(x+13,418);c.arc(x,418,13,0,Math.PI*2,true)});
  c.fill('evenodd');
  c.strokeStyle='rgba(227,178,60,.12)';c.lineWidth=1.5;ARCHES.forEach(a=>{c.beginPath();c.ellipse(a.cx,EAU+2,a.sp/2+6,a.rise+6,0,Math.PI,0);c.stroke()});
  c.fillStyle='#21130e';c.fillRect(640,TABLIER-12,ARCHES.fin-640,12);
  LANTERNES.forEach((x,i)=>{c.fillStyle='#120b08';c.fillRect(x-2,TABLIER-48,4,36);c.fillRect(x-6,TABLIER-56,12,10);
    const f=.85+.15*Math.sin(t*7+i*2);c.save();c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(x,TABLIER-51,1,x,TABLIER-51,40);g.addColorStop(0,`rgba(255,214,130,${.8*f})`);g.addColorStop(1,'rgba(255,214,130,0)');c.fillStyle=g;c.beginPath();c.arc(x,TABLIER-51,40,0,7);c.fill();c.restore()});
}
function garonne(c,t){

}

/* ---------- B3. le carrefour, le réverbère qui grésille ---------- */

/* ---------- C. le banc près du lavoir, deux heures du matin ---------- */
const LC=[[39,'L','Ma nourrice disait que j’étais une chouette.',2],[41.2,'C','Pas une chouette. Un hibou.',1.7],[43,'C','Un petit hibou.',1.6],[44.9,'L','Petit hibou…',1.5]];
function sceneC(c,t){

  c.fillStyle='#0b0706';[715,860,1005,1145].forEach(x=>c.fillRect(x-6,392,12,140));
  c.fillStyle='#24303c';c.fillRect(720,532,430,30);c.fillStyle='rgba(200,215,235,.18)';for(let k=0;k<6;k++)c.fillRect(740+k*70+(Math.sin(t*1.3+k)*8),544,30,2);

/* ---------- D. Purpan, l'allée de platanes, quatre heures moins dix ---------- */
const KM=.6,HS=520,HX=640-390*KM,HY=HS-640*KM; // la maison du plan coté, au bout d'une courte allée
const GX0=575,GW=130,GTOP=402,GBAS=600; // la grille de fer forgé peinte en vert
function grille(c,ouv){
  c.save();c.strokeStyle='#1f3a2c';c.fillStyle='#1f3a2c';c.lineWidth=3;
  for(let x=4;x<W;x+=14){if(x>GX0-8&&x<GX0+GW+8)continue;c.beginPath();c.moveTo(x,GBAS);c.lineTo(x,GTOP+10);c.stroke();c.beginPath();c.moveTo(x-4,GTOP+12);c.lineTo(x,GTOP-4);c.lineTo(x+4,GTOP+12);c.fill()}
  c.lineWidth=4;[[0,GX0-8],[GX0+GW+8,W]].forEach(([a,b])=>[GTOP+34,GBAS-30].forEach(y=>{c.beginPath();c.moveTo(a,y);c.lineTo(b,y);c.stroke()}));
  c.strokeStyle='rgba(150,200,160,.18)';c.lineWidth=1;for(let x=5;x<W;x+=14){if(x>GX0-8&&x<GX0+GW+8)continue;c.beginPath();c.moveTo(x,GBAS);c.lineTo(x,GTOP+12);c.stroke()}
  // piliers de pierre
  [[GX0-22],[GX0+GW+6]].forEach(([x])=>{c.fillStyle='#4a4238';c.fillRect(x,GTOP-24,18,GBAS-GTOP+24);c.fillStyle='#5a5246';c.fillRect(x-4,GTOP-30,26,8)});
  // le vantail, qui s'ouvre vers le jardin (ne grince pas)
  c.translate(GX0+2,0);c.scale(1-.85*ouv,1);c.strokeStyle='#1f3a2c';c.fillStyle='#1f3a2c';c.lineWidth=3;
  for(let x=6;x<GW-4;x+=12){c.beginPath();c.moveTo(x,GBAS);c.lineTo(x,GTOP+18);c.stroke();c.beginPath();c.moveTo(x-4,GTOP+20);c.lineTo(x,GTOP+4);c.lineTo(x+4,GTOP+20);c.fill()}
  c.lineWidth=4;[GTOP+34,GBAS-30].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(GW-4,y);c.stroke()});c.beginPath();c.arc(GW/2-2,(GTOP+GBAS)/2+8,18,0,7);c.stroke();
  c.restore();
}
function lanterne(c,x,y){
  c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,1,x,y,46);g.addColorStop(0,'rgba(235,225,200,.42)');g.addColorStop(1,'rgba(235,225,200,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,46,0,7);c.fill();c.restore();
  c.fillStyle='#0b0706';c.fillRect(x-1,y-16,2,8);c.beginPath();c.moveTo(x-7,y-8);c.lineTo(x+7,y-8);c.lineTo(x+5,y+6);c.lineTo(x-5,y+6);c.closePath();c.fill();
  c.fillStyle='rgba(250,232,190,.9)';c.fillRect(x-4,y-5,8,9);
}
function perron(c){ // six marches de pierre devant la porte
  const px=HX+390*KM;
  for(let k=0;k<6;k++){const y=HS+k*6,w=56+k*12;c.fillStyle=k%2?'#463e34':'#4c443a';c.fillRect(px-w/2,y,w,6);c.fillStyle='rgba(235,225,200,.12)';c.fillRect(px-w/2,y,w,1)}
}
const LD=[[52.3,'C','Maurice organise une soirée demain.',1.8],[54.2,'L','Demain, c’est ce soir.',1.5],[55.8,'L','Je ne sais pas si je pourrai.',1.6],
  [57.6,'L','Mais j’essaierai.',1.4],[59.5,'C','Bonne nuit, petit hibou.',1.6],[61.3,'L','Il est quatre heures du matin, monsieur le peintre.',2.1],
  [63.5,'L','Ce n’est plus la nuit.',1.5],[65.3,'C','Pour les hiboux, si.',1.7]];
function sceneD(c,t){
  L.ciel(c,0,540);L.etoiles(c,t,0,0,false,300);
  // le jardin, givré
  c.fillStyle='#0d1712';c.fillRect(0,HS-4,W,GBAS-HS+4);
  // la maison noire ; seule une lanterne au-dessus du perron ; la fenêtre de sa chambre entrouverte. Glycine d'hiver.
  c.save();c.translate(HX,HY);c.scale(KM,KM);L.maisonSarrail(c,{lumLouise:0,ouvre:.25,grappes:false});c.restore();
  perron(c);lanterne(c,HX+390*KM,HY+438*KM);
  // l'allée, du perron à la grille
  c.fillStyle='#29251e';c.beginPath();c.moveTo(HX+390*KM-46,HS+36);c.lineTo(HX+390*KM+46,HS+36);c.lineTo(GX0+GW,GBAS);c.lineTo(GX0,GBAS);c.closePath();c.fill();
  for(let k=0;k<70;k++){const x=((k*131.7)%W),y=HS+4+((k*37)%(GBAS-HS-6));c.fillStyle='rgba(225,235,245,.09)';c.fillRect(x,y,2,1.5)}
  // l'allée de platanes, qui commence à la grille
  [[.78,570,215],[1.04,604,262]].forEach(([s,y,o],i)=>{platane(c,640-o,y,330,i+1,s);platane(c,640+o,y,330,i+6,s)});
  // Louise : arrivée, face à face, puis la grille, le jardin en courant sur la pointe des pieds, le coin de la maison
  const arr=seg(t,49.5,51.8),f1=seg(t,67.4,68.1),f2=seg(t,68.1,70);
  const ouv=eio(seg(t,67.5,67.9))*(1-eio(seg(t,68.8,69.2)));
  let rc,rl=null,dedans=null;
  const CX=470;
  // Louise dans le jardin (derrière la grille)
  if(f2>0&&t<72.6){
    const coin=HX+(S.facade.x+S.facade.w)*KM+14,u=eio(f2);
    let x=lerp(GX0+GW/2,coin,u);const sol=lerp(GBAS+4,HS+2,u),s=lerp(.92,.6,u);
    const dis=seg(t,72.1,72.5);x+=dis*30;
    const pl=f2<1?L.pas(P.debout,(t-68.1)*13,.26,0):JSON.parse(JSON.stringify(P.debout));
    const tour=seg(t,70.1,70.5),F=lerp(1,-1,eio(tour));
    const lv=seg(t,71.3,71.7)*(1-seg(t,72.2,72.5));if(lv>0)pl.aF=[lerp(.12,2.6,lv),lerp(.15,.2,lv)];
    c.save();c.globalAlpha=1-dis;dedans=L.pantin(c,{x,F:Math.abs(F)<.02?.02:F,p:pl,s,sol,levres:true},'L');c.restore();
  }
  pave(c,GBAS,true,0);
  grille(c,ouv);
  if(arr<1){const r=couple(c,lerp(200,CX,eio(arr)),(t-49.5)*9*(1-arr*.5),.32*(1-arr));rc=r.C;rl=r.L}
  else{
    const pc=JSON.parse(JSON.stringify(P.debout));pc.hd=-.06;
    // les mains dans les poches, immobile ; il lève la main le premier
    if(t>67)pc.aF=[.15,.6],pc.aB=[-.05,.6];
    if(t>68.2)pc.hd=-.16;
    const leve=seg(t,70.8,71.2)*(1-seg(t,72.5,72.9));if(leve>0)pc.aF=[lerp(.15,2.5,leve),lerp(.6,.3,leve)];
    rc=L.pantin(c,{x:CX,F:1,p:pc},'C');
    if(f2<=0){
      const ap=seg(t,51.8,52.4);let pl,x,F;
      if(f1>0){x=lerp(CX+90,GX0+GW/2,eio(f1));pl=L.pas(P.debout,(t-67.4)*13,.26,0);F=1}
      else{x=lerp(CX+34,CX+90,eio(ap));pl=ap<1?L.pas(P.debout,(t-51.8)*10,.2,0):JSON.parse(JSON.stringify(P.debout));pl.aF=[.2,.3];pl.hd=-.08;F=lerp(1,-1,eio(seg(t,52,52.4)))}
      rl=L.pantin(c,{x,F:Math.abs(F)<.02?.02:F,p:pl,levres:true},'L');
    }
  }
  if(rc&&rl){const FL=t<52.2||t>67.4?1:-1;souffles(c,t,LD,{C:rc.tete,L:rl.tete},{C:1,L:FL});
    // leurs souffles se mêlent entre eux, même sans parler
    if(arr>=1&&t>52.4&&t<67){const m={x:(rc.tete.x+rl.tete.x)/2,y:rc.tete.y+10};const a=.12+.06*Math.sin(t*2.2);c.fillStyle=`rgba(225,232,240,${a})`;c.beginPath();c.ellipse(m.x,m.y,14+6*Math.sin(t*1.7),7,0,0,7);c.fill()}
    dire(c,t,LD,{C:rc.tete,L:rl.tete})}
  heure(c,'PURPAN · QUATRE HEURES MOINS DIX',env(t,49.6,6));
}

const OUVERTURE=[{s:'CHAPITRE 4 · L’HEURE DES HIBOUX',y:300,f:"20px "+L.F.machine,c:'#b9a98c',ls:'5px'},{s:'Il n’y a plus de tramway à cette heure-ci.',y:380,f:"italic 46px "+L.F.texte}];
const FIN=[{s:'Il ne se coucha pas. Il alla droit au chevalet,',y:330,f:"italic 38px "+L.F.texte},{s:'où la toile vierge l’attendait depuis dix jours.',y:384,f:"italic 38px "+L.F.texte},{s:'Il savait enfin quoi peindre.',y:470,f:"46px "+L.F.main,c:L.C.or}];
const DUREE=79;
// fondus au noir entre les tableaux
const COUPES=[[14.4,.35],[20.2,.35],[27.2,.35],[35.4,.45],[49.4,.45]];
function rendu(c,t){
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  if(t>2.9&&t<73.6){
    if(t<14.4)sceneA(c,t);else if(t<20.2)sceneB1(c,t);else if(t<27.2)sceneB2(c,t);else if(t<35.4)sceneB3(c,t);else if(t<49.4)sceneC(c,t);else sceneD(c,t);
  }
  let n=t<3?1:t<4?1-(t-3):t>72.8?Math.min(1,(t-72.8)/.8):0;
  for(const[k,d]of COUPES){const a=1-Math.abs(t-k)/d;if(a>n)n=a}
  L.noir(c,n);
  L.carton(c,OUVERTURE,t<.6?t/.6:t<2.4?1:Math.max(0,1-(t-2.4)/.6),450);
  L.carton(c,FIN,seg(t,74,74.8)*(1-seg(t,78,78.8)),560);
}

function partition(ac,sortie,T){
  const K=L.kit(ac,sortie);
  K.projecteur(T,DUREE);
  // A : la porte du cabaret, l'orchestre qui s'échappe puis se ferme, le froid
  K.nappe(T+2.9,11.5,'bandpass',260,.6,[[0,.02],[.4,.07],[1.6,.012],[11.2,.012],[11.5,0]]);
  K.nappe(T+2.9,70,'lowpass',380,.5,[[1,.022],[69,.018],[70,0]]);
  // pas dans la nuit
  const pas=(a,b,cad,g)=>{for(let t=a;t<b;t+=cad){K.noise(T+t,.05,'bandpass',1200,1.4,g,.003);K.noise(T+t+cad*.47,.05,'bandpass',1700,1.4,g*.7,.003)}};
  pas(3.5,4.6,.62,.05);pas(12.2,14.4,.62,.05);pas(14.4,20.2,.62,.05);pas(20.2,27.2,.62,.05);pas(27.2,29.3,.7,.045);pas(49.5,51.8,.68,.045);pas(67.5,70.2,.34,.025);
  // le thème, lentement, au piano, pendant la marche
  const p=K.bus();
  K.phrase(L.THEME.lent,T+13.2,.9,'piano',p,.045);
  [[13.2,'Dm9'],[17.8,'G13'],[22.4,'Cmaj9'],[27,'Fmaj9']].forEach(([w,n])=>K.nappeAccord(n,T+w,4.8,p,.007));
  [[13.2,38],[17.8,43],[22.4,36],[27,41]].forEach(([w,n])=>K.basse(n,T+w,p,.13));
  // le réverbère qui grésille
  for(let t=28;t<35;t+=.07){const n=Math.floor(t*14);if((n*7)%11<2||(n*13)%17===0)K.noise(T+t,.06,'highpass',3000,.8,.02,.002)}
  // C : le bouchon déjà sauté ; deux gorgées ; le rire de Louise, jaune de Naples
  K.noise(T+36.4,.3,'bandpass',600,3,.02,.05);K.noise(T+38,.3,'bandpass',650,3,.02,.05);
  K.phrase(L.THEME.reponse,T+39.5,.95,'piano',p,.04);
  [[39.5,'Am9'],[43.3,'Dm9']].forEach(([w,n])=>K.nappeAccord(n,T+w,4,p,.006));
  [79,83,86,91,88,95].forEach((m,i)=>K.cloche(m,T+45.7+i*.13,null,.02));
  // D : Purpan
  K.phrase(L.THEME.lent,T+51,1.05,'piano',p,.04);
  [[51,'Dm9'],[56.4,'G13'],[61.8,'Cmaj9'],[67.2,'Fmaj9']].forEach(([w,n])=>K.nappeAccord(n,T+w,5.4,p,.007));
  [[51,38],[56.4,43],[61.8,36],[67.2,41]].forEach(([w,n])=>K.basse(n,T+w,p,.12));
  // les mains levées, puis la fin
  K.cloche(91,T+71.2,null,.03);K.cloche(86,T+71.6,null,.025);
  K.nappeAccord('Fmaj9',T+74,4.6,p,.01);K.phrase([[0,79,2],[2,84,4]],T+74.3,.9,'piano',p,.035);
  K.finale(T,DUREE);
}

L.film({duree:DUREE,rendu,partition,affiche:43});
})();

</script>
<script>/* ——— plan 07 ——— */
/* Plan 07 — Le lendemain (chapitre 5, ~82 s)
   A. Purpan, la chambre de Louise, le matin : elle se réveille en souriant, sort le carnet du double fond
      et écrit « Observation clinique. Sujet : moi-même. » (la page de l'enveloppe 2).
   B. La salle à manger, « un tribunal avant l'entrée des juges » : le grand-père derrière La Dépêche,
      la grand-mère et sa biscotte, Marthe qui sert le café et baisse les yeux. « Même avec la peste. »
   C. Le grenier, midi : Célestin peint à l'huile, sans esquisse ; Julien arrive, regarde longtemps.
      « Il y a quelqu'un, dedans. » … « Qu'on les retrouve. »
   D. Dix-huit heures cinq : le petit garçon, le mot du petit hibou (celui de l'enveloppe 2, mot pour mot),
      Célestin prend sa veste et dévale l'escalier. */
(function(){
const L=LDD,{clamp,lerp,eio,eoc,seg}=L,W=L.W,H=L.H,SOL=L.SOL,P=L.POSES;
const cp=p=>JSON.parse(JSON.stringify(p));

function heure(c,s,a){if(a<=0)return;c.save();c.globalAlpha=a;c.textAlign='right';c.font="30px "+L.F.machine;L.setLS(c,'3px');
  c.lineWidth=5;c.strokeStyle='rgba(20,12,8,.8)';c.strokeText(s,1230,64);c.fillStyle=L.C.or;c.fillText(s,1230,64);L.setLS(c,'0px');c.restore()}
function parole(c,s,x,y,a){if(a<=0)return;c.save();c.globalAlpha=a;c.textAlign='center';c.font="27px "+L.F.main;c.lineWidth=5;c.strokeStyle='rgba(20,12,8,.85)';

/* ================= D. le jardin, la grille, l'allée ================= */
function platane(c,x,base,h,k,sc){sc=sc||1;c.save();c.translate(x,base);c.scale(sc,sc);c.strokeStyle='#0a0d12';c.lineCap='round';
  const br=(x0,y0,a,l,w,d)=>{if(d>5||l<7)return;const x1=x0+Math.sin(a)*l,y1=y0-Math.cos(a)*l;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();br(x1,y1,a-.4-((d*k)%3)*.06,l*.72,w*.62,d+1);br(x1,y1,a+.36+((d+k)%3)*.06,l*.7,w*.62,d+1)};

  const p=c.createRadialGradient(x,SOL,2,x,SOL,200);p.addColorStop(0,`rgba(255,214,130,${.28*on})`);p.addColorStop(1,'rgba(255,214,130,0)');c.fillStyle=p;c.beginPath();c.ellipse(x,SOL,200,30,0,0,7);c.fill();c.restore()}
const KM=.6,HS=520,HX=640-390*KM,HY=HS-640*KM;

  c.lineWidth=4;[[0,GX0-8],[GX0+GW+8,W]].forEach(([a,b])=>[GTOP+34,GBAS-30].forEach(y=>{c.beginPath();c.moveTo(a,y);c.lineTo(b,y);c.stroke()}));
  [GX0-22,GX0+GW+6].forEach(x=>{c.fillStyle='#4a4238';c.fillRect(x,GTOP-24,18,GBAS-GTOP+24);c.fillStyle='#5a5246';c.fillRect(x-4,GTOP-30,26,8)});

  for(let x=6;x<GW-4;x+=12){c.beginPath();c.moveTo(x,GBAS);c.lineTo(x,GTOP+18);c.stroke();c.beginPath();c.moveTo(x-4,GTOP+20);c.lineTo(x,GTOP+4);c.lineTo(x+4,GTOP+20);c.fill()}
  c.lineWidth=4;[GTOP+34,GBAS-30].forEach(y=>{c.beginPath();c.moveTo(0,y);c.lineTo(GW-4,y);c.stroke()});c.beginPath();c.arc(GW/2-2,(GTOP+GBAS)/2+8,18,0,7);c.stroke();c.restore()}
function perron(c){const px=HX+390*KM;for(let k=0;k<6;k++){const y=HS+k*6,w=56+k*12;c.fillStyle=k%2?'#463e34':'#4c443a';c.fillRect(px-w/2,y,w,6)}}
const LD=[[68.4,'L','J’ai vingt-six ans et je viens de m’évader de chez moi par une glycine.',2.7],[71.3,'L','En pantalon de golf.',1.5],[73,'C','Il vous va très bien.',1.5],

<script>/* ——— plan 09 ——— */
/* Plan 09 — La soirée des lendemains (chapitre 8, ~125 s)
   A. La porte rouge, un peu après 22 h 40 : Solange pousse un cri, traverse la piste ; le pantalon de Gaston ;
      « une tenue pour chasser la bécasse » ; elle emmène Louise dans l'arrière-salle. Maurice : « Tu as fait vite, le peintre. »
   B. L'atmosphère de fin de noce : le grand blond et sa coupe, la dactylo qui refait son grand écart sur une table,
      les deux aviateurs de chez Latécoère. Louise revient en robe de soie champagne brodée de perles ; il pose son verre sans le finir.
   C. Fox-trot, charleston (mal, avec une joie féroce), valse lente (la cuisine de Castres, les un-deux-trois).
   D. À table : « Il faudra le remercier. » … « Tout a à voir avec tout, petit hibou. »
   E. Léon sur scène : « Il n'a pas encore de nom. » « Hier c'était un accident. Aujourd'hui c'est un choix. »
   F. Le morceau sans nom, plus lent : elle joue avec la ligne, s'arrête dos tourné, revient jusqu'à lui.
      La trompette tient une note, puis silence. Le premier baiser, sur la pointe des pieds. La salle explose.
   G. « Pardon… » « Moi je sais. » « La même chose qu'à moi, petit hibou. » Le second baiser ; Léon rejoue le morceau.
   Liberté reprise du plan 05 : la ligne invisible en filet d'or sur le parquet. */
(function(){
const L=LDD,{clamp,lerp,eio,eoc,seg}=L,eic=L.eic,W=L.W,H=L.H,P=L.POSES,SC=L.SCENE;

const env=(t,a,d)=>seg(t,a,a+.3)*(1-seg(t,a+d-.3,a+d));
// caméra fixe (z) : les têtes renvoyées par les pantins sont converties en coordonnées d'écran
const Z=1.08,CX=640,CY=420;
const ecran=p=>p&&{x:640+(p.x-CX)*Z,y:360+(p.y-CY)*Z};
function dire(c,t,lignes,tetes){const act=[];for(const l of lignes){const a=env(t,l[0],L.lue(l));if(a<=0)continue;const h=ecran(tetes[l[1]]);if(h)act.push([l,a,h.x+(l[4]||0),h.y-(l[5]||66)])}act.sort((p,q)=>p[0][0]-q[0][0]);let sa=0,sy=0;for(const e of act){sa+=e[1];sy+=e[1]*e[3]}const Ya=sa?sy/sa:0;act.forEach((e,i)=>{let r=0;for(let j=i+1;j<act.length;j++)r+=Math.min(1,3*act[j][1]);parole(c,e[0][2],e[2],Math.max(46,Ya-34*r),e[1])})}

// la robe de soie champagne brodée de perles, qui accroche la lumière des lampes à chaque pas
let OFF=null;
function champagne(c,t,st,flare){
  if(!OFF){OFF=document.createElement('canvas');OFF.width=W;OFF.height=H}const o=OFF.getContext('2d');
  o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,W,H);o.setTransform(c.getTransform());o.globalAlpha=c.globalAlpha;
  const r=L.pantin(o,st,'L',flare||0),s=st.s||1;o.globalAlpha=1;
  o.globalCompositeOperation='source-atop';const g=o.createLinearGradient(0,r.hanche.y-64*s,0,r.hanche.y+52*s);g.addColorStop(0,'#c9ad7a');g.addColorStop(1,'#e2c994');o.fillStyle=g;
  o.fillRect(r.hanche.x-70*s,r.hanche.y-58*s,140*s,108*s);
  for(let k=0;k<26;k++){const a=.5+.5*Math.sin(t*7+k*2.3);o.fillStyle=`rgba(255,250,235,${.75*a})`;o.fillRect(r.hanche.x+(((k*37)%60)-30)*s,r.hanche.y+(((k*53)%96)-52)*s,2*s,2*s)}
  o.globalCompositeOperation='source-over';o.setTransform(1,0,0,1,0,0);
  c.save();c.setTransform(1,0,0,1,0,0);c.drawImage(OFF,0,0);c.restore();return r}
function golf(c,r,s){const y0=r.hanche.y+40*s,y1=r.hanche.y+66*s,x=r.hanche.x;c.save();c.fillStyle='#3b2c20';c.fillRect(x-13*s,y0,26*s,y1-y0);
  c.strokeStyle='rgba(200,170,120,.45)';c.lineWidth=1;for(let k=1;k<4;k++){c.beginPath();c.moveTo(x-13*s,y0+k*(y1-y0)/4);c.lineTo(x+13*s,y0+k*(y1-y0)/4);c.stroke();c.beginPath();c.moveTo(x-13*s+k*6.5*s,y0);c.lineTo(x-13*s+k*6.5*s,y1);c.stroke()}c.restore()}

function coupe(c,m){if(!m)return;c.fillStyle=L.C.or;c.beginPath();c.moveTo(m.x-11,m.y-26);c.lineTo(m.x+11,m.y-26);c.lineTo(m.x+6,m.y-12);c.lineTo(m.x-6,m.y-12);c.closePath();c.fill();c.fillRect(m.x-2,m.y-12,4,10);c.fillRect(m.x-7,m.y-3,14,3)}
// les portes : la porte rouge de la rue, à gauche ; l'arrière-salle, à droite

/* ---------------- les figurants de la soirée ---------------- */
function figurants(c,t,o){
  // le grand blond au cure-dent fait visiter sa coupe
  const pb=cp(P.debout);pb.aF=[2.2+.3*Math.sin(t*3),.2];const rb=L.pantin(c,{x:300+40*Math.sin(t*.4),F:1,p:pb,s:.82,sol:560},'X');coupe(c,rb.main);
  c.fillStyle='#e8dcc2';c.fillRect(rb.tete.x+8,rb.tete.y+6,9,1.5);
  // la dactylo du grand écart, qui le refait sur une table
  petiteTable(c,1000,532,.9);
  const ec=o.ecart==null?(.5+.5*Math.sin(t*1.1)):o.ecart;const pd=cp(P.debout);pd.lF=[lerp(.1,1.5,ec),0];pd.lB=[lerp(-.1,-1.5,ec),0];pd.aF=[2.6,.1];pd.aB=[-2.6,.1];
  L.pantin(c,{x:1000,F:1,p:pd,s:.8,hipY:532-lerp(80,6,ec)},'Y');
}
function aviateurs(c,t,o){

const LA=[[5.4,'S','La voilà ! Ma petite ! On te croyait morte !',2.2],[8,'S','Qu’est-ce que c’est que ça ?',1.6],[9.8,'L','C’est à mon cousin Gaston. Il est dans les Ordres.',2.3],
  [12.3,'S','Ce n’est pas une tenue pour danser, c’est une tenue pour chasser la bécasse.',2.8],[15.3,'S','Il lui manque une frange. Viens, j’ai mieux pour toi.',2.3],
  [17.9,'M','Tu as fait vite, le peintre.',1.7,0,250],[19.8,'C','J’avais une bonne raison.',1.6]];
function sceneA(c,t){
  const ouv=eio(seg(t,3.2,3.7))*(1-eio(seg(t,5,5.5)));portes(c,ouv,eio(seg(t,16.6,17))*(1-eio(seg(t,18.2,18.6))));
  figurants(c,t,{});
  const tetes={};
  // ils entrent par la porte rouge et avancent sur la piste
  const av=eio(seg(t,3.6,5.6)),pr=prof(av),marche=t>3.6&&t<5.6;
  const pc=marche?L.pas(P.debout,t*10,.3,0):cp(P.debout);pc.aF=[.15,.6];pc.aB=[-.05,.6];
  if(t>17.2&&t<18.2)pc.aF=[1.2,.3]; // la poignée de main
  const xc=lerp(80,500,av);const rc=L.pantin(c,{x:xc,F:1,p:pc,s:pr.s,sol:pr.sol},'C');tetes.C=rc.tete;
  // Louise, puis l'arrière-salle avec Solange
  const sort=eio(seg(t,15.8,17.4)),ps=prof(1-sort);
  let xl=lerp(130,580,av);if(sort>0)xl=lerp(580,1200,sort);
  const pl=(marche||(sort>0&&sort<1))?L.pas(P.debout,t*10+3,.28,0):cp(P.debout);pl.hd=-.05;
  if(t>8.2&&t<9.4)pl.hd=.3; // elle baisse les yeux sur le pantalon
  const Fl=sort>0?1:(t>6&&t<15.8?1:1);
  const rl=t<17.4?L.pantin(c,{x:xl,F:Fl,p:pl,s:sort>0?ps.s:pr.s,sol:sort>0?ps.sol:pr.sol,levres:true},'L'):null;if(rl){golf(c,rl,sort>0?ps.s:pr.s);tetes.L=rl.tete}
  // Solange : le cri, la traversée de la piste, plumes au vent, l'étreinte, le recul
  const court=eio(seg(t,4.6,5.8));let xs=lerp(1010,660,court);let Fs=-1;const ss=cp(P.debout);
  if(court>0&&court<1)Object.assign(ss,L.pas(P.debout,t*14,.42,0));
  if(t>5.8&&t<7.4){ss.aF=[1.5,.9];ss.aB=[1.4,1];xs=lerp(660,618,eio(seg(t,5.8,6.1)))}
  if(t>=7.4&&t<15.8){xs=lerp(618,680,eio(seg(t,7.4,7.8)));if(t>7.9&&t<9.6){ss.tA=-.12;ss.hd=.3}}
  if(t>12.3&&t<15)ss.aF=[1.4+.3*Math.sin(t*6),.2];
  if(sort>0){xs=lerp(680,1240,sort);Fs=1;if(sort<1)Object.assign(ss,L.pas(P.debout,t*10,.28,0))}
  if(t<17.6){const rs=L.pantin(c,{x:xs,F:Fs,p:ss,s:sort>0?ps.s:1,sol:sort>0?ps.sol:SOLP},'S');tetes.S=rs.tete}
  if(t>4.4&&t<5.2){c.fillStyle='rgba(240,230,200,.8)';c.beginPath();c.arc(1000,560+(t-4.4)*60,4,0,7);c.fill()} // le verre renversé
  // Maurice et son clin d'œil
  if(t>16.4){const am=eio(seg(t,16.4,17.4));c.save();L.maurice(c,lerp(900,640,am),SOLP,{chapeau:false,main:t>17.2&&t<18.2?{x:-40,y:-120}:{x:52,y:-96}});c.restore();tetes.M={x:lerp(900,640,am),y:SOLP};
    if(t>18.6&&t<18.9){c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,240,200,.9)';c.beginPath();c.arc(lerp(900,640,am)+6,SOLP-196,3,0,7);c.fill();c.restore()}}
  return tetes;
}
/* ================= B. la fin de noce, la robe champagne ================= */
function sceneB(c,t){
  portes(c,0,eio(seg(t,25.4,25.8))*(1-eio(seg(t,27,27.4))));
  figurants(c,t,{});
  const tetes={};
  const rav=aviateurs(c,t,{x:760,leve:t>22.4&&t<24});
  // Célestin, un verre à la main ; il le pose sans le finir
  const pc=cp(P.debout);pc.aF=[1.3,.6];pc.F=1;const pose=seg(t,28.4,29.2);if(pose>0)pc.aF=[lerp(1.3,.9,pose),lerp(.6,1.1,pose)];if(t>29.2)pc.aF=[.15,.6];pc.hd=t>26.6?-.05:.05;
  const fx=t>26.4?1:-1;const rc=L.pantin(c,{x:640,F:fx,p:pc},'C');if(t<29.2)verre(c,rc.main);else{c.fillStyle='rgba(240,230,200,.8)';c.fillRect(560,598,6,10)}
  tetes.C=rc.tete;
  // Louise revient de l'arrière-salle
  if(t>25.6){const u=eio(seg(t,25.6,28.4)),pr=prof(u);const pl=u<1?L.pas(P.debout,t*9,.26,0):cp(P.debout);pl.hd=-.06;
    const rl=champagne(c,t,{x:lerp(1200,800,u),F:-1,p:pl,s:pr.s,sol:pr.sol,levres:true},.12);tetes.L=rl.tete}
  return tetes;
}
/* ================= C. trois danses ================= */
function sceneC(c,t){
  portes(c,0,0);figurants(c,t,{});
  const st={C:{x:585,F:1,p:cp(P.tenue)},L:{x:695,F:-1,p:cp(P.tenue),levres:true},flare:.1};
  if(t<34.4){ // fox-trot, pour se retrouver
    const ph=(t-30)/.5*Math.PI,X=640+50*Math.sin((t-30)*.8);st.C.x=X-55;st.L.x=X+55;st.C.p=L.pas(P.tenue,ph,.3,0);st.L.p=L.pas(P.tenue,ph+Math.PI,.3,0)}
  else if(t<38.8){ // charleston : mal, avec une joie féroce
    const ph=(t-34.4)/.2*Math.PI,X=640;st.C.x=X-80;st.L.x=X+80;st.C.F=1;st.L.F=-1;
    const k=Math.sin(ph),k2=Math.sin(ph+.6+.4*Math.sin(t*3)); // elle, un peu à contretemps
    st.C.p={tA:.05,hd:-.05,aF:[.9+.5*k,.6],aB:[-.9+.5*k,.6],lF:[.4*k,-.5*Math.max(0,k)],lB:[-.3*k,-.4*Math.max(0,-k)]};
    st.L.p={tA:.12*k2,hd:-.1+.1*k2,aF:[1.2+.9*k2,.4],aB:[-1.2+.9*k2,.4],lF:[.7*k2,-.7*Math.max(0,k2)],lB:[-.5*k2,-.5*Math.max(0,-k2)]};st.flare=.3+.3*Math.abs(k2)}
  else{ // valse lente : la cuisine de Castres
    const ph=(t-38.8)/.55*Math.PI*2/3,ang=(t-38.8)*1.4,X=640+60*Math.sin((t-38.8)*.6);
    const cx=Math.cos(ang);st.C.x=X-55*cx;st.L.x=X+55*cx;st.C.F=cx>=0?1:-1;st.L.F=-st.C.F;if(Math.abs(cx)<.15){st.C.F=cx>=0?.2:-.2;st.L.F=-st.C.F}
    st.C.p=L.pas(P.tenue,ph,.22,0);st.L.p=L.pas(P.tenue,ph+Math.PI,.22,0);st.flare=.2}
  c.fillStyle='rgba(0,0,0,.35)';[st.C,st.L].forEach(d=>{c.beginPath();c.ellipse(d.x,SOLP+3,30,6,0,0,7);c.fill()});
  const rc=L.pantin(c,{...st.C,sol:SOLP},'C'),rl=champagne(c,t,{...st.L,sol:SOLP},st.flare);
  return{C:rc.tete,L:rl.tete};
}

// la danse : il l'envoie au bout de son bras ; elle joue avec la ligne, ralentit, s'arrête dos tourné, revient jusqu'à lui
function danse(t){
  const Xc=520;const C={x:Xc,F:1,p:cp(P.debout)},Lo={x:Xc+90,F:-1,p:cp(P.debout),levres:true};let flare=.15,fil=false,ligne=seg(t,84,85)*(1-seg(t,101.6,103));
  if(t<83.6){ // il la mène sur la piste
    const u=eio(seg(t,82,83.6));C.x=lerp(600,Xc,u);Lo.x=lerp(720,Xc+90,u);C.p=u<1?L.pas(P.debout,t*9,.25,0):C.p;Lo.p=u<1?L.pas(P.debout,t*9+3,.22,0):Lo.p;C.p.aF=[1.2,.2];Lo.p.aF=[1.2,.2];Lo.F=-1}
  else if(t<99.4){
    fil=true;const per=3.4,tt=t-83.6;let u=(tt%per)/per;const cyc=Math.floor(tt/per);
    // elle ralentit quand il l'attend vite (cycle 2), s'arrête au bout de la ligne, dos tourné (cycle 3)
    if(cyc===2)u=Math.pow(u,1.6);
    let d=80+150*Math.pow(Math.sin(Math.PI*u),1.3);
    const arret=cyc===3&&u>.38&&u<.8;if(arret)d=230;
    Lo.x=Xc+d;const sortant=u<.5;
    Lo.F=sortant?(u<.08?-Math.cos(Math.PI*u/.08):1):(u<.58?Math.cos(Math.PI*(u-.5)/.08):-1);
    if(arret){Lo.F=1;C.x=Xc+lerp(0,120,eio(seg(u,.5,.8)))} // il vient la chercher
    const ph=t/.42*Math.PI;C.p=L.pas(P.debout,ph*.5,.08,0);C.p.tA=.04*Math.sin(t*2);C.p.aF=[1.35,.1];C.p.hd=-.05;
    Lo.p=arret?cp(P.debout):L.pas(P.debout,ph,.3,0);
    if(Lo.F>0){Lo.p.aB=[-1.3,-.1];Lo.p.aF=[.5+.3*Math.sin(t*3),.6]}else{Lo.p.aF=[1.35,.1];Lo.p.aB=[-.4,.5]}
    if(arret){Lo.p.aB=[-.9,-.1];Lo.p.hd=-.15;Lo.p.tA=-.05}
    // les perles comme un défi
    const defi=cyc===1&&u>.42&&u<.6;if(defi){Lo.p.tA=.12*Math.sin(t*16);flare=.5}
    else flare=.15+.2*Math.abs(Math.sin(t*3));
  }else{ // la dernière mesure : elle continue, jusqu'à lui
    const u=eio(seg(t,99.4,100.6));Lo.x=lerp(Xc+150,Xc+34,u);Lo.F=-1;C.p=cp(P.debout);C.p.aF=[lerp(1.35,.9,u),.6];C.p.hd=lerp(-.05,.18,u);
    Lo.p=cp(P.debout);Lo.p.hd=lerp(-.05,-.32,u);Lo.p.aF=[lerp(1.3,1.1,u),.4];
    const pointe=seg(t,102.6,103);Lo.lift=8*pointe*(1-seg(t,104.2,104.6));

function narr(c,s,a,y){if(a<=0)return;c.save();c.globalAlpha=a;c.textAlign='center';c.font="italic 32px "+L.F.texte;c.lineWidth=5;c.strokeStyle='rgba(8,10,18,.85)';c.strokeText(s,640,y);c.fillStyle='#f1e7d3';c.fillText(s,640,y);c.restore()}
function lunettes(c,r,F){c.save();c.strokeStyle=L.C.papier;c.lineWidth=1.4;c.beginPath();c.arc(r.tete.x+F*7,r.tete.y+1,4,0,7);c.stroke();c.restore()}
function plume(c,r){c.save();c.fillStyle='#f1e7d3';c.translate(r.tete.x-4,r.tete.y-10);c.rotate(-.5);c.beginPath();c.ellipse(0,-12,4,13,0,0,7);c.fill();c.restore()}
function violon(c,m,F,joue,t){if(!m)return;c.save();c.translate(m.x,m.y);c.rotate(F*-.5);c.fillStyle='#7a4a22';c.beginPath();c.ellipse(0,0,8,14,0,0,7);c.fill();c.fillRect(-1.5,-26,3,14);c.restore();
  if(joue){c.strokeStyle='#d9c9a8';c.lineWidth=1.4;const a=Math.sin(t*3)*14;c.beginPath();c.moveTo(m.x-20*F+a,m.y+10);c.lineTo(m.x+26*F+a,m.y-6);c.stroke()}}
